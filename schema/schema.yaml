        description: 'Enable extended attributes. Default: false'
      - name: enable_writeback_cache
        type: boolean
        description: 'Enable the writeback cache. Default: true'
      - name: max_write
        type: uint32
        description: 'Maximum write size in bytes. Default: 131072'
      - name: skip_rw
        type: boolean
        description: 'Skip read and write operations and complete them immediately (for benchmarking). Default: false'
  - name: fsdev_aio_delete
