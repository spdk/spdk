objects:
  - name: bdev_nvme_multipath_opts
    fields:
      - name: policy
        type: enum
        class: bdev_nvme_multipath_policy
        description: Multipath policy
      - name: selector
        type: enum
        class: bdev_nvme_multipath_selector
        description: Multipath selector
      - name: min_io
        type: uint32
        description: Number of IO to route to a path before switching (round_robin selector only).
  - name: iscsi_auth_secret
    fields:
      - name: user
        type: string
        required: true
        description: Unidirectional CHAP name
      - name: secret
        type: string
        required: true
        description: Unidirectional CHAP secret
      - name: muser
        type: string
        description: Bidirectional CHAP name
      - name: msecret
        type: string
        description: Bidirectional CHAP secret
  - name: iscsi_pg_ig_map
    fields:
      - name: ig_tag
        type: int32
        required: true
        description: Existing initiator group tag
      - name: pg_tag
        type: int32
        required: true
        description: Existing portal group tag
  - name: iscsi_portal
    fields:
      - name: host
        type: string
        required: true
        description: Hostname or IP address
      - name: port
        type: string
        required: true
        description: Port number
  - name: scsi_lun
    fields:
      - name: lun_id
        type: int32
        description: SCSI LUN ID
      - name: bdev_name
        type: string
        description: Backing bdev name
  - name: nvmf_listen_address
    fields:
      - name: trtype
        type: string
        required: true
        description: 'NVMe-oF transport type: e.g., rdma'
      - name: adrfam
        type: string
        description: 'NVMe-oF transport adrfam: e.g., ipv4, ipv6, ib, fc, intra_host'
      - name: traddr
        type: string
        required: true
        description: 'NVMe-oF transport address: e.g., an ip address'
      - name: trsvcid
        type: string
        description: 'NVMe-oF transport service id: e.g., a port number (required for TCP and RDMA transport types)'
  - name: nvmf_namespace
    fields:
      - name: nsid
        type: uint32
        description: Namespace ID between 1 and 4294967294
      - name: bdev_name
        type: string
        required: true
        description: Name of the bdev to expose as a namespace
      - name: nguid
        type: string
        description: 16-byte namespace globally unique identifier in hexadecimal
      - name: eui64
        type: string
        description: 8-byte namespace EUI-64 in hexadecimal
      - name: uuid
        type: uuid
        description: RFC 4122 UUID (e.g. "ceccf520-691e-4b46-9546-34af789907c5")
      - name: ptpl_file
        type: string
        description: File path to save/restore persistent reservation information
      - name: anagrpid
        type: uint32
        description: ANA group ID
      - name: no_auto_visible
        type: boolean
        description: Do not auto make namespace visible to controllers
      - name: hide_metadata
        type: boolean
        deprecated: true
        description: '[Deprecated] Enable hide_metadata option to the bdev'
  - name: nvmf_admin_cmd_passthru
    fields:
      - name: identify_ctrlr
        type: boolean
        description: If true, enables custom identify handler that reports some identify attributes from the underlying NVMe drive
      - name: identify_uuid_list
        type: boolean
        description: If true, enables passthru identify UUID list (0x17 CNS) admin cmds for underlying NVMe device
      - name: get_log_page
        type: boolean
        description: If true, enables passthru get log page command handlers for underlying NVMe drive (for non-fabrics related log pages)
      - name: get_set_features
        type: boolean
        description: If true, enables passthru get/set_feature OPC handlers for underlying NVMe drive
      - name: sanitize
        type: boolean
        description: If true, enables passthru sanitize OPC handlers for underlying NVMe drive
      - name: security_send_recv
        type: boolean
        description: If true, enables passthru security send/recieve OPC handlers for underlying NVMe drive
      - name: fw_update
        type: boolean
        description: If true, enables passthru firmware download/commit OPC handlers for underlying NVMe drive
      - name: nvme_mi
        type: boolean
        description: If true, enables passthru NVMe-MI send/recieve OPC handlers for underlying NVMe drive
      - name: vendor_specific
        type: boolean
        description: 'If true, enables passthru command handlers for underlying NVMe drive for vendor specific cmds (OPCs: 0xC0-0xFF)'
  - name: vhost_blk_controller_params
    fields:
      - name: bdev
        type: string
        description: Backing bdev name or Null if bdev is hot-removed
      - name: readonly
        type: boolean
        description: True if controllers is readonly, false otherwise
  - name: vhost_scsi_controller_params
    fields:
      - name: target_name
        type: string
        description: Name of this SCSI target
      - name: id
        type: uint32
        description: Unique SPDK global SCSI target ID
      - name: scsi_dev_num
        type: uint32
        description: SCSI target ID initiator will see when scanning this controller
      - name: luns
        type: array
        class: scsi_luns
        description: array of objects describing @ref rpc_vhost_get_controllers_scsi_luns
arrays:
  - name: bdev_histogram_borders
    item_type: uint64
    max_count: 256
  - name: bdev_iostat_names
    item_type: string
    max_count: 1024
  - name: iscsi_initiators
    item_type: string
    max_count: 256
  - name: iscsi_netmasks
    item_type: string
    max_count: 256
  - name: iscsi_pg_ig_maps
    item_type: object
    class: iscsi_pg_ig_map
    max_count: 256
  - name: scsi_luns
    item_type: object
    class: scsi_lun
    max_count: 64
  - name: iscsi_portals
    item_type: object
    class: iscsi_portal
    max_count: 1024
  - name: iscsi_auth_secrets
    item_type: object
    class: iscsi_auth_secret
    max_count: 64
  - name: raid_base_bdevs
    item_type: string
    max_count: 255
bitmasks:
  - name: dhchap_digests
    enum: dhchap_digest
    mode: set
    width: 32
  - name: dhchap_dhgroups
    enum: dhchap_dhgroup
    mode: set
    width: 32
  - name: oncs_features
    enum: oncs_feature
    mode: clear
    width: 16
  - name: fuses_features
    enum: fuses_feature
    mode: clear
    width: 16
  - name: nvmf_discovery_filters
    enum: nvmf_discovery_filter
    mode: set
    width: 32
methods:
  - name: spdk_kill_instance
    description: Send a signal to the application.
    params:
      - name: sig_name
        type: enum
        class: kill_signal
        required: true
        description: Signal to send
  - name: framework_monitor_context_switch
    description: 'Query, enable, or disable the context switch monitoring functionality.'
    params:
      - name: enabled
        type: boolean
        description: Enable or disable context switch monitoring; omit to query the current state
  - name: framework_start_init
    description: |
      Start initialization of SPDK subsystems when it is deferred by starting SPDK application with option -w.
      During its deferral some RPCs can be used to set global parameters for SPDK subsystems.
      This RPC can be called only once.
    params: []
  - name: framework_wait_init
    description: |
      Do not return until all subsystems have been initialized and the RPC system state is running.
      If the application is already running, this call will return immediately. This RPC can be called at any time.
    params: []
  - name: rpc_get_methods
    description: Get an array of supported RPC methods.
    params:
      - name: current
        type: boolean
        description: 'Return only RPC methods callable in the current state. Default: false'
      - name: include_aliases
        type: boolean
        description: 'Include deprecated method aliases in the result. Default: false'
  - name: framework_get_subsystems
    description: Get an array of name and dependency relationship of SPDK subsystems in initialization order.
    params: []
  - name: framework_get_config
    description: Get current configuration of the specified SPDK framework
    params:
      - name: name
        type: string
        required: true
        description: Name of the SPDK subsystem to query
      - name: with_batches
        type: boolean
        required: false
        description: 'Keep batch arrays in output. Default: false (flatten into individual entries)'
  - name: framework_get_reactors
    description: Retrieve an array of all reactors.
    params: []
  - name: framework_set_scheduler
    description: |
      Select thread scheduler that will be activated.
      This feature is considered as experimental.
    params:
      - name: name
        type: string
        required: true
        description: 'Scheduler name: `static` (fixed core pinning) or `dynamic` (load-based thread migration across cores)'
      - name: period
        type: uint64
        description: 'Scheduler period in microseconds. Default: 1000000 (1 second) on first set'
      - name: load_limit
        type: uint8
        description: 'Thread load percentage above which threads may move (dynamic only). Default: 20'
      - name: core_limit
        type: uint8
        description: 'Core busy percentage at which the core is considered full (dynamic only). Default: 80'
      - name: core_busy
        type: uint8
        description: 'Core busy percentage at which the scheduler starts moving threads to other cores (dynamic only). Default: 95'
      - name: mappings
        type: string
        description: Comma-separated list of thread:core mappings (static only)
  - name: framework_get_scheduler
    description: 'Retrieve currently set scheduler name and period, along with current governor name.'
    params: []
  - name: framework_get_governor
    description: 'Retrieve current governor name, power env, frequencies available and frequency set to the cpu cores.'
    params: []
  - name: scheduler_set_options
    description: |
      Set options for scheduler.

      This RPC may only be called before SPDK subsystems have been initialized. This RPC can be called only once.
    params:
      - name: scheduling_core
        type: uint32
        description: 'Core that the scheduler runs on; idle threads are moved here. Default: current scheduling core'
      - name: isolated_core_mask
        type: string
        description: CPU mask of cores excluded from scheduling decisions; must not include scheduling_core
  - name: framework_enable_cpumask_locks
    description: |
      Enable CPU core lock files to block multiple SPDK applications from running on the same cpumask.
      The CPU core locks are enabled by default, unless user specified `--disable-cpumask-locks` command
      line option when launching SPDK.

      This RPC may be called after locks have already been enabled, with no effect and no error response.
    params: []
  - name: framework_disable_cpumask_locks
    description: |
      Disable CPU core lock files. The locks can also be disabled during startup, when
      user specifies `--disable-cpumask-locks` command line option during SPDK launch.

      This RPC may be called after locks have already been disabled, with no effect and no error
      response.
    params: []
  - name: thread_get_stats
    description: Retrieve current statistics of all the threads.
    params: []
  - name: thread_set_cpumask
    description: |
      Set the cpumask of the thread to the specified value. The thread may be migrated
      to one of the specified CPUs.
    params:
      - name: id
        type: uint64
        required: true
        description: ID of the SPDK thread to move
      - name: cpumask
        type: string
        required: true
        description: CPU mask of cores the thread is allowed to run on
  - name: trace_enable_tpoint_group
    description: |
      Enable trace on a specific tpoint group. For example "bdev" for bdev trace group,
      "all" for all trace groups.
    params:
      - name: name
        type: string
        required: true
        description: Name of a registered trace group, or "all" to enable every group
  - name: trace_disable_tpoint_group
    description: |
      Disable trace on a specific tpoint group. For example "bdev" for bdev trace group,
      "all" for all trace groups.
    params:
      - name: name
        type: string
        required: true
        description: Name of a registered trace group, or "all" to disable every group
  - name: trace_set_tpoint_mask
    description: |
      Enable tracepoint mask on a specific tpoint group. For example "bdev" for bdev trace group,
      and 0x1 to enable the first tracepoint inside the group (BDEV_IO_START). This command will not
      disable already active tracepoints or those not specified in the mask. For a full description
      of all available trace groups, see
      [tracepoint documentation](https://spdk.io/doc/tracepoints.html).
    params:
      - name: name
        type: string
        required: true
        description: Name of a registered trace group (e.g. "bdev", "nvmf_rdma", "nvmf_tcp")
      - name: tpoint_mask
        type: uint64
        required: true
        description: Bitmask of tracepoints to enable within the group (e.g. 0x3 enables the first two)
  - name: trace_clear_tpoint_mask
    description: |
      Disable tracepoint mask on a specific tpoint group. For example "bdev" for bdev trace group,
      and 0x1 to disable the first tracepoint inside the group (BDEV_IO_START). For a full description
      of all available trace groups, see
      [tracepoint documentation](https://spdk.io/doc/tracepoints.html).
    params:
      - name: name
        type: string
        required: true
        description: Name of a registered trace group (e.g. "bdev", "nvmf_rdma", "nvmf_tcp")
      - name: tpoint_mask
        type: uint64
        required: true
        description: Bitmask of tracepoints to disable within the group (e.g. 0x3 disables the first two)
  - name: trace_get_tpoint_group_mask
    description: Display mask info for every group.
    params: []
  - name: trace_clear
    description: |
      Clear trace history. All entries recorded before this call will be
      hidden from subsequent reads by external trace tools such as spdk_trace.
      This does not disable tracing; new entries continue to be recorded.
    params: []
  - name: trace_get_info
    description: |
      Get name of shared memory file, list of the available trace point groups
      and mask of the available trace points for each group
    params: []
  - name: log_set_print_level
    description: |
      Set the current level at which output will additionally be
      sent to the current console.
    params:
      - name: level
        type: enum
        class: log_level
        required: true
        description: Log print level
  - name: log_get_print_level
    description: |
      Get the current level at which output will additionally be
      sent to the current console.
    params: []
  - name: log_set_level
    description: 'Set the current logging level output by the `log` module.'
    params:
      - name: level
        type: enum
        class: log_level
        required: true
        description: Log level
  - name: log_get_level
    description: 'Get the current logging level output by the `log` module.'
    params: []
  - name: log_set_flag
    description: |
      Enable logging for specific portions of the application. The list of possible
      log flags can be obtained using the `log_get_flags` RPC and may be different
      for each application.
    params:
      - name: flag
        type: string
        required: true
        description: Log flag name (e.g. "nvme") or "all" to set all flags
  - name: log_clear_flag
    description: |
      Disable logging for specific portions of the application. The list of possible
      log flags can be obtained using the `log_get_flags` RPC and may be different
      for each application.
    params:
      - name: flag
        type: string
        required: true
        description: Log flag name (e.g. "nvme") or "all" to clear all flags
  - name: log_get_flags
    description: |
      Get the list of valid flags for this application and whether
      they are currently enabled.
    params: []
  - name: log_enable_timestamps
    description: Enable or disable timestamps.
    params:
      - name: enabled
        type: boolean
        required: true
        description: Enable (true) or disable (false) timestamps in log output
  - name: thread_get_pollers
    description: Retrieve current pollers of all the threads.
    params: []
  - name: thread_get_io_channels
    description: Retrieve current IO channels of all the threads.
    params: []
  - name: env_dpdk_get_mem_stats
    description: Write the dpdk memory stats to a file.
    params: []
  - name: accel_get_module_info
    description: Get a list of valid module names and their supported operations.
    params: []
  - name: accel_get_opc_assignments
    description: Get a list of opcode names and their assigned accel_fw modules.
    params: []
  - name: accel_assign_opc
    description: Manually assign an operation to a module.
    params:
      - name: opname
        type: string
        required: true
        description: Name of the accel operation; see accel_get_opc_assignments for the list
      - name: module
        type: string
        required: true
        description: Name of the accel module to assign the operation to
  - name: accel_crypto_key_create
    description: Create a crypto key which will be used in accel framework
    params:
      - name: cipher
        type: enum
        class: accel_crypto_cipher
        required: true
        description: Crypto cipher
      - name: key
        type: string
        required: true
        description: Key in hex form
      - name: key2
        type: string
        description: Second part of the key (or tweak) in hex form, required for AES_XTS
      - name: tweak_mode
        type: enum
        class: accel_crypto_tweak_mode
        description: Tweak mode
      - name: name
        type: string
        required: true
        description: Name of the key
  - name: accel_crypto_key_destroy
    description: Destroy a crypto key. The user is responsible for ensuring that the deleted key is not used by acceleration modules.
    params:
      - name: key_name
        type: string
        required: true
        description: Name of the key to destroy
  - name: accel_crypto_keys_get
    description: Get information about existing crypto keys
    params:
      - name: key_name
        type: string
        description: 'Name of a specific key to query. Default: list all'
  - name: accel_set_driver
    description: |
      Select platform driver to execute operation chains.  Until a driver is selected, all operations are
      executed through accel modules.
    params:
      - name: name
        type: string
        description: Name of the platform driver, or empty string to disable
  - name: accel_set_options
    description: Set accel framework's options.
    params:
      - name: small_cache_size
        type: uint32
        description: Size of the small iobuf cache
      - name: large_cache_size
        type: uint32
        description: Size of the large iobuf cache
      - name: task_count
        type: uint32
        description: Maximum number of tasks per IO channel
      - name: sequence_count
        type: uint32
        description: Maximum number of sequences per IO channel
      - name: buf_count
        type: uint32
        description: Maximum number of accel buffers per IO channel
  - name: accel_get_stats
    description: |
      Retrieve accel framework's statistics.  Statistics for opcodes that have never been executed (i.e.
      all their stats are at 0) aren't included in the `operations` array.
    params: []
  - name: accel_error_inject_error
    description: |
      Inject an error to execution of a given operation.  Note, that in order for the errors to be
      actually injected, the error module must be assigned to that operation via `accel_assign_opc`.
    params:
      - name: opcode
        type: enum
        class: accel_error_opcode
        required: true
        description: Accel operation to inject errors into
      - name: type
        type: enum
        class: accel_error_inject_type
        required: true
        description: Injection type
      - name: count
        type: uint64
        description: 'Number of errors to inject on each IO channel; 0 disables injection. Default: UINT64_MAX (no limit)'
      - name: interval
        type: uint64
        description: Inject every Nth operation
      - name: errcode
        type: int32
        description: Error code to return; only relevant for type=failure
  - name: compressdev_scan_accel_module
    description: |
      Set config and enable compressdev accel module offload.
      Select the DPDK polled mode driver (pmd) for the accel compress module,
      0 = auto-select, 1= QAT only, 2 = mlx5_pci only, 3 = uadk only.
    params:
      - name: pmd
        type: uint32
        required: true
        description: 'PMD selection: 0=auto, 1=QAT only, 2=mlx5_pci only, 3=uadk only'
  - name: dsa_scan_accel_module
    description: |
      Set config and enable dsa accel module offload.
      This feature is considered as experimental.
    params:
      - name: config_kernel_mode
        type: boolean
        description: 'Use the kernel idxd driver instead of user-mode. Default: false'
  - name: iaa_scan_accel_module
    description: |
      Enable IAA accel module offload.
      This feature is considered as experimental.
    params: []
  - name: ioat_scan_accel_module
    description: Enable ioat accel module offload.
    params: []
  - name: ae4dma_scan_accel_module
    description: Enable ae4dma accel module offload.
    params: []
  - name: dpdk_cryptodev_scan_accel_module
    description: Enable dpdk_cryptodev accel offload
    params: []
  - name: dpdk_cryptodev_set_driver
    description: Set the DPDK cryptodev driver
    params:
      - name: driver_name
        type: enum
        class: dpdk_cryptodev_driver
        required: true
        description: DPDK crypto driver
  - name: dpdk_cryptodev_get_driver
    description: Get the DPDK cryptodev driver
    params: []
  - name: mlx5_scan_accel_module
    description: Enable mlx5 accel offload
    params:
      - name: qp_size
        type: uint16
        description: Queue pair size
      - name: num_requests
        type: uint32
        description: Size of the shared requests pool
      - name: allowed_devs
        type: string
        description: Comma separated list of allowed device names, e.g. mlx5_0,mlx5_1
      - name: crypto_split_blocks
        type: uint16
        description: Number of data blocks to be processed in 1 crypto UMR. [0-65535], 0 means no limit
      - name: enable_driver
        type: boolean
        description: 'Enable mlx5 platform driver. Note: the driver supports reduced scope of operations, enable with care'
  - name: accel_mlx5_dump_stats
    description: Dump mlx5 accel module statistics
    params:
      - name: level
        type: enum
        class: accel_mlx5_dump_state_level
        description: Verbosity level
  - name: cuda_scan_accel_module
    description: Enable cuda accel module offload.
    params: []
  - name: bdev_set_options
    description: |
      Set global parameters for the block device (bdev) subsystem.  This RPC may only be called
      before SPDK subsystems have been initialized.
    params:
      - name: bdev_io_pool_size
        type: uint32
        description: Number of spdk_bdev_io structures in shared buffer pool
      - name: bdev_io_cache_size
        type: uint32
        description: Maximum number of spdk_bdev_io structures cached per thread
      - name: bdev_auto_examine
        type: boolean
        description: If set to false, the bdev layer will not examine every disks automatically
      - name: iobuf_small_cache_size
        type: uint32
        description: Size of the small iobuf per thread cache
      - name: iobuf_large_cache_size
        type: uint32
        description: Size of the large iobuf per thread cache
  - name: bdev_get_bdevs
    description: Get information about block devices (bdevs).
    params:
      - name: name
        type: string
        description: Block device name
      - name: timeout
        type: uint64
        description: Time (ms) to wait for a bdev with specified name to appear
  - name: bdev_examine
    description: |
      Request that the bdev layer examines the given bdev for metadata and creates
      new bdevs if metadata is found. This is only necessary if `auto_examine` has
      been set to false using `bdev_set_options`. By default, `auto_examine` is true
      and bdev examination is automatic.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
  - name: bdev_wait_for_examine
    description: Report when all bdevs have been examined by every bdev module.
    params: []
  - name: bdev_get_iostat
    description: Get I/O statistics of block devices (bdevs).
    params:
      - name: names
        type: array
        class: bdev_iostat_names
        description: Array of block device names to obtain statistics from
      - name: per_channel
        type: boolean
        description: Display per channel data for specified block device.
      - name: reset_mode
        type: enum
        class: bdev_reset_stat_mode
        description: 'Mode to reset I/O statistics after obtaining it: all, maxmin, error, none (default: none)'
  - name: bdev_reset_iostat
    description: |
      Reset I/O statistics of block devices (bdevs). Note that if one consumer resets I/O statistics,
      it affects all other consumers.
    params:
      - name: name
        type: string
        description: Block device name
      - name: mode
        type: enum
        class: bdev_reset_stat_mode
        description: 'Mode to reset I/O statistics: all, maxmin, error, none (default: all)'
  - name: bdev_enable_histogram
    description: Control whether collecting data for histogram is enabled for specified bdev.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
      - name: enable
        type: boolean
        required: true
        description: Enable or disable histogram on specified device
      - name: opc
        type: string
        description: IO type name
      - name: granularity
        type: uint8
        description: 'Histogram bucket granularity. Default: 7'
      - name: min_nsec
        type: uint64
        description: 'Min value in nanoseconds to track. Default: 1000 (1us)'
      - name: max_nsec
        type: uint64
        description: 'Max value in nanoseconds to track. Default: 120000000000 (120 seconds)'
  - name: bdev_get_histogram
    description: Get latency histogram for specified bdev.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
  - name: bdev_get_histogram_borders
    description: Dump latency histogram for specified bdev into user-provided borders.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
      - name: borders
        type: array
        class: bdev_histogram_borders
        required: true
        description: Array of buckets in microseconds to dump histogram into
  - name: bdev_set_qos_limit
    description: Set the quality of service rate limit on a bdev.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
      - name: rw_ios_per_sec
        type: uint64
        description: Number of R/W I/Os per second to allow. 0 means unlimited.
      - name: rw_mbytes_per_sec
        type: uint64
        description: Number of R/W megabytes per second to allow. 0 means unlimited.
      - name: r_mbytes_per_sec
        type: uint64
        description: Number of Read megabytes per second to allow. 0 means unlimited.
      - name: w_mbytes_per_sec
        type: uint64
        description: Number of Write megabytes per second to allow. 0 means unlimited.
  - name: bdev_set_qd_sampling_period
    description: Enable queue depth tracking on a specified bdev.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
      - name: period
        type: uint64
        required: true
        description: period (in microseconds).If set to 0, polling will be disabled.
  - name: bdev_crypto_create
    description: Create a new crypto bdev on a given base bdev.
    params:
      - name: base_bdev_name
        type: string
        required: true
        description: Name of the base bdev
      - name: name
        type: string
        required: true
        description: Name of the crypto vbdev to create
      - name: crypto_pmd
        type: string
        description: Name of the crypto device driver. Obsolete, see accel_crypto_key_create
      - name: key
        type: string
        description: Key in hex form. Obsolete, see accel_crypto_key_create
      - name: cipher
        type: string
        description: Cipher to use, AES_CBC or AES_XTS (QAT and MLX5). Obsolete, see accel_crypto_key_create
      - name: key2
        type: string
        description: 2nd key in hex form only required for cipher AET_XTS. Obsolete, see accel_crypto_key_create
      - name: key_name
        type: string
        description: Name of the key created with accel_crypto_key_create
  - name: bdev_crypto_delete
    description: Delete a crypto bdev.
    params:
      - name: name
        type: string
        required: true
        description: Name of the crypto bdev
  - name: bdev_ocf_create
    description: |
      Construct new OCF bdev.
      Command accepts cache mode that is going to be used.
      You can find more details about supported cache modes in the [OCF documentation](https://open-cas.github.io/cache_configuration.html#cache-mode)
    params:
      - name: name
        type: string
        required: true
        description: Bdev name to use
      - name: mode
        type: string
        required: true
        description: 'OCF cache mode: wb, wt, pt, wa, wi, wo'
      - name: cache_line_size
        type: uint64
        description: 'OCF cache line size in KiB: 4, 8, 16, 32, 64'
      - name: cache_bdev_name
        type: string
        required: true
        description: Name of underlying cache bdev
      - name: core_bdev_name
        type: string
        required: true
        description: Name of underlying core bdev
  - name: bdev_ocf_delete
    description: Delete the OCF bdev
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_ocf_get_stats
    description: Get statistics of chosen OCF block device.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
  - name: bdev_ocf_reset_stats
    description: Reset statistics of chosen OCF block device.
    params:
      - name: name
        type: string
        required: true
        description: Block device name
  - name: bdev_ocf_get_bdevs
    description: Get list of OCF devices including unregistered ones.
    params:
      - name: name
        type: string
        description: Name of OCF vbdev or name of cache device or name of core device
  - name: bdev_ocf_set_cache_mode
    description: Set new cache mode on OCF bdev.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: mode
        type: string
        required: true
        description: 'OCF cache mode: wb, wt, pt, wa, wi, wo'
  - name: bdev_ocf_set_seqcutoff
    description: |
      Set sequential cutoff parameters on all cores for the given OCF cache device.
      A brief description of this functionality can be found in [OpenCAS documentation](https://open-cas.github.io/guide_tool_details.html#seq-cutoff).
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: policy
        type: string
        required: true
        description: 'Sequential cutoff policy: always, full, never'
      - name: threshold
        type: uint32
        description: Activation threshold in KiB
      - name: promotion_count
        type: uint32
        description: Promotion request count
  - name: bdev_ocf_flush_start
    description: |
      Start flushing OCF cache device.

      Automatic flushes of dirty data are managed by OCF cleaning policy settings.
      In addition to that, all dirty data is flushed to core device when there is
      an attempt to stop caching.
      On the other hand, this RPC call gives a possibility to flush dirty data manually
      when there is a need for it, e.g. to speed up the shutdown process when data
      hasn't been flushed for a long time.
      This RPC returns immediately, and flush is then being performed in the
      background. To see the status of flushing operation use bdev_ocf_flush_status.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_ocf_flush_status
    description: |
      Get flush status of OCF cache device.

      Automatic flushes of dirty data are managed by OCF cleaning policy settings.
      In addition to that, all dirty data is flushed to core device when there is
      an attempt to stop caching.
      On the other hand, there is a possibility to flush dirty data manually
      when there is a need for it, e.g. to speed up the shutdown process when data
      hasn't been flushed for a long time.
      This RPC reports if such manual flush is still in progress and if the operation
      was successful. To start manual flush use bdev_ocf_flush_start.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_malloc_create
    description: |
      Construct @ref bdev_config_malloc

      The `dif_type` parameter can have 0, 1, 2, or 3, and controls the check of the guard tag and the reference tag.
      If the `dif_type` is 1, 2, or 3, the malloc bdev compares the guard tag to the CRC-16 computed over the block data.
      If the `dif_type` is 1 or 2, the malloc bdev compares the reference tag to the computed reference tag.
      The computed reference tag for the first block of the I/O is the `init_ref_tag` of the DIF context, and
      the computed reference tag is incremented for each subsequent block.
      If the `dif_type` is 3, the malloc bdev does not check the reference tag.
      The application tag is not checked by the malloc bdev because the current block device API does not expose
      it to the upper layer yet.
    params:
      - name: name
        type: string
        description: Bdev name to use
      - name: block_size
        type: uint32
        required: true
        description: Data block size in bytes -must be multiple of 512
      - name: num_blocks
        type: uint64
        required: true
        description: Number of blocks
      - name: uuid
        type: uuid
        description: UUID of new bdev
      - name: optimal_io_boundary
        type: uint32
        description: Split on optimal IO boundary, in number of blocks, default 0
      - name: md_size
        type: uint32
        description: Metadata size for this bdev (0, 8, 16, 32, 64, or 128). Default is 0.
      - name: md_interleave
        type: boolean
        description: Metadata location, interleaved if true, and separated if false. Default is false.
      - name: dif_type
        type: int32
        description: Protection information type. Parameter --md-size needs to be set along --dif-type. Default=0 - no protection.
      - name: dif_is_head_of_md
        type: boolean
        description: Protection information is in the first 8 bytes of metadata. Default=false.
      - name: physical_block_size
        type: uint32
        description: Physical block size of device; must be a power of 2 and at least 512
      - name: dif_pi_format
        type: uint32
        description: protection information format
      - name: numa_id
        type: int32
        required: false
        description: NUMA node ID where memory is allocated, if -1 then any NUMA node ID can be used. Default is -1.
  - name: bdev_malloc_delete
    description: 'Delete @ref bdev_config_malloc'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_null_create
    description: 'Construct @ref bdev_config_null'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name to use
      - name: block_size
        type: uint32
        required: true
        description: Block size in bytes
      - name: num_blocks
        type: uint64
        required: true
        description: Number of blocks
      - name: uuid
        type: uuid
        description: UUID of new bdev
      - name: physical_block_size
        type: uint32
        description: Physical block size for this bdev.
      - name: md_size
        type: uint32
        description: Metadata size for this bdev. Default=0.
      - name: dif_type
        type: int32
        description: Protection information type. Parameter --md-size needs to be set along --dif-type. Default=0 - no protection.
      - name: dif_pi_format
        type: uint32
        description: protection information format
      - name: dif_is_head_of_md
        type: boolean
        description: Protection information is in the first 8 bytes of metadata. Default=false.
      - name: preferred_write_granularity
        type: uint32
        description: Preferred write granularity in blocks
      - name: preferred_write_alignment
        type: uint32
        description: Preferred write alignment in blocks
      - name: optimal_write_size
        type: uint32
        description: Optimal write size in blocks
      - name: preferred_unmap_granularity
        type: uint32
        description: Preferred unmap granularity in blocks
      - name: preferred_unmap_alignment
        type: uint32
        description: Preferred unmap alignment in blocks
  - name: bdev_null_delete
    description: 'Delete @ref bdev_config_null.'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_null_resize
    description: 'Resize @ref bdev_config_null.'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: new_size
        type: uint64
        required: true
        description: Bdev new capacity in MiB
  - name: bdev_aio_create
    description: 'Construct @ref bdev_config_aio.'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name to use
      - name: filename
        type: string
        required: true
        description: Path to device or file
      - name: block_size
        type: uint32
        description: Block size in bytes
      - name: readonly
        type: boolean
        description: set aio bdev as read-only
      - name: fallocate
        type: boolean
        description: Enable UNMAP and WRITE ZEROES support. Intended only for testing purposes due to synchronous syscall.
      - name: uuid
        type: uuid
        description: UUID of new bdev
      - name: nowait
        type: boolean
        description: Enable the RWF_NOWAIT flag for block devices. If the flag is not defined, or if the specified device is not a block device, creation will fail. Note that this feature is not advertised by the kernel to userspace. Use with caution, and only if the device is known to work correctly with your kernel.
  - name: bdev_aio_rescan
    description: 'Rescan the size of @ref bdev_config_aio.'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_aio_delete
    description: 'Delete @ref bdev_config_aio.'
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_nvme_set_options
    description: |
      Set global parameters for all bdev NVMe. This RPC may only be called before SPDK subsystems have been initialized
      or any bdev NVMe has been created.

      Parameters, ctrlr_loss_timeout_sec, reconnect_delay_sec, and fast_io_fail_timeout_sec, are for I/O error resiliency.
      They can be overridden if they are given by the RPC bdev_nvme_attach_controller.
    params:
      - name: action_on_timeout
        type: enum
        class: bdev_nvme_timeout_action
        description: 'Action to take on command time out: none, reset or abort'
      - name: timeout_us
        type: uint64
        description: Timeout for each command, in microseconds. If 0, don't track timeouts
      - name: timeout_admin_us
        type: uint64
        description: Timeout for each admin command, in microseconds. If 0, treat same as io timeouts ('timeout_us')
      - name: keep_alive_timeout_ms
        type: uint32
        description: Keep alive timeout period in milliseconds, default is 10s
      - name: arbitration_burst
        type: uint32
        description: The value is expressed as a power of two, a value of 111b indicates no limit
      - name: low_priority_weight
        type: uint32
        description: The maximum number of commands that the controller may launch at one time from a low priority queue
      - name: medium_priority_weight
        type: uint32
        description: The maximum number of commands that the controller may launch at one time from a medium priority queue
      - name: high_priority_weight
        type: uint32
        description: The maximum number of commands that the controller may launch at one time from a high priority queue
      - name: nvme_adminq_poll_period_us
        type: uint64
        description: How often the admin queue is polled for asynchronous events in microseconds
      - name: nvme_ioq_poll_period_us
        type: uint64
        description: 'How often I/O queues are polled for completions, in microseconds. Default: 0 (as fast as possible).'
      - name: io_queue_requests
        type: uint32
        description: 'The number of requests allocated for each NVMe I/O queue. Default: 512.'
      - name: delay_cmd_submit
        type: boolean
        description: 'Enable delaying NVMe command submission to allow batching of multiple commands. Default: `true`.'
      - name: transport_retry_count
        type: uint32
        description: The number of attempts per I/O in the transport layer before an I/O fails.
      - name: bdev_retry_count
        type: int32
        description: The number of attempts per I/O in the bdev layer before an I/O fails. -1 means infinite retries.
      - name: transport_ack_timeout
        type: uint8
        description: Time to wait ack until retransmission for RDMA or connection close for TCP. Range 0-31 where 0 means use default.
      - name: ctrlr_loss_timeout_sec
        type: int32
        description: Time to wait until ctrlr is reconnected before deleting ctrlr.  -1 means infinite reconnects. 0 means no reconnect.
      - name: reconnect_delay_sec
        type: uint32
        description: Time to delay a reconnect trial. 0 means no reconnect.
      - name: fast_io_fail_timeout_sec
        type: uint32
        description: Time to wait until ctrlr is reconnected before failing I/O to ctrlr. 0 means no such timeout.
      - name: disable_auto_failback
        type: boolean
        description: Disable automatic failback. The RPC bdev_nvme_set_preferred_path can be used to do manual failback.
      - name: generate_uuids
        type: boolean
        description: Enable generation of UUIDs for NVMe bdevs that do not provide this value themselves.
      - name: transport_tos
        type: uint8
        description: 'IPv4 Type of Service value. Only applicable for RDMA transport. Default: 0 (no TOS is applied).'
      - name: nvme_error_stat
        type: boolean
        description: Enable collecting NVMe error counts.
      - name: rdma_srq_size
        type: uint32
        description: 'Set the size of a shared rdma receive queue. Default: 0 (disabled).'
      - name: io_path_stat
        type: boolean
        description: 'Enable collecting I/O stat of each nvme bdev io path. Default: `false`.'
      - name: allow_accel_sequence
        type: boolean
        description: 'Allow NVMe bdevs to advertise support for accel sequences if the controller also supports them.  Default: `false`.'
      - name: rdma_max_cq_size
        type: uint32
        description: 'Set the maximum size of a rdma completion queue. Default: 0 (unlimited)'
      - name: rdma_cm_event_timeout_ms
        type: uint16
        description: 'Time to wait for RDMA CM events. Default: 0 (0 means using default value of driver).'
      - name: dhchap_digests
        type: bitmask
        class: dhchap_digests
        description: List of allowed DH-HMAC-CHAP digests.
      - name: dhchap_dhgroups
        type: bitmask
        class: dhchap_dhgroups
        description: List of allowed DH-HMAC-CHAP DH groups.
      - name: rdma_umr_per_io
        type: boolean
        description: Enable/disable scatter-gather UMR per IO in RDMA transport if supported by system
      - name: tcp_connect_timeout_ms
        type: uint32
        description: 'Time to wait until TCP connection is done. Default: 0 (no timeout).'
      - name: enable_flush
        type: boolean
        description: 'If true, pass flush to nvme devices when volatile write cache is present. Default : `false`.'
      - name: multipath_opts
        type: object
        class: bdev_nvme_multipath_opts
        description: Default multipath options.
  - name: bdev_nvme_set_hotplug
    description: |
      Change settings of the NVMe hotplug feature. If enabled, PCIe NVMe bdevs will be automatically discovered on insertion
      and deleted on removal.
    params:
      - name: enable
        type: boolean
        required: true
        description: True to enable, false to disable
      - name: period_us
        type: uint64
        description: 'How often to poll for hot-insert and hot-remove events. Values: 0 - reset/use default or 1 to 10000000.'
  - name: bdev_nvme_attach_controller
    description: |
      Construct @ref bdev_config_nvme. This RPC can also be used to add additional paths to an existing controller to enable
      multipathing. This is done by specifying the `name` parameter as an existing controller. When adding an additional
      path, the hostnqn, hostsvcid, hostaddr, prchk_reftag, and prchk_guard_arguments must not be specified and are assumed
      to have the same value as the existing path.

      The parameters, `ctrlr_loss_timeout_sec`, `reconnect_delay_sec`, and `fast_io_fail_timeout_sec`, are mutually dependent.
      If `reconnect_delay_sec` is non-zero, `ctrlr_loss_timeout_sec` has to be -1 or not less than `reconnect_delay_sec`.
      If `reconnect_delay_sec` is zero, `ctrlr_loss_timeout_sec` has to be zero.
      If `fast_io_fail_timeout_sec` is not zero, it has to be not less than `reconnect_delay_sec` and less than `ctrlr_loss_timeout_sec` if `ctrlr_loss_timeout_sec` is not -1.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe controller, prefix for each bdev name
      - name: trtype
        type: string
        required: true
        description: 'NVMe-oF target trtype: rdma or pcie'
      - name: traddr
        type: string
        required: true
        description: 'NVMe-oF target address: ip or BDF'
      - name: adrfam
        type: string
        description: 'NVMe-oF target adrfam: ipv4, ipv6, ib, fc, intra_host'
      - name: trsvcid
        type: string
        description: 'NVMe-oF target trsvcid: port number'
      - name: priority
        type: string
        description: Transport connection priority. Supported by TCP transport with POSIX sock module (see socket(7) man page).
      - name: subnqn
        type: string
        description: NVMe-oF target subnqn
      - name: hostnqn
        type: string
        description: NVMe-oF target hostnqn
      - name: hostaddr
        type: string
        description: 'NVMe-oF host address: ip address'
      - name: hostsvcid
        type: string
        description: 'NVMe-oF host trsvcid: port number'
      - name: prchk_reftag
        type: boolean
        description: Enable checking of PI reference tag for I/O processing
      - name: prchk_guard
        type: boolean
        description: Enable checking of PI guard for I/O processing
      - name: hdgst
        type: boolean
        description: Enable TCP header digest
      - name: ddgst
        type: boolean
        description: Enable TCP data digest
      - name: fabrics_connect_timeout_us
        type: uint64
        description: Timeout for fabrics connect (in microseconds)
      - name: multipath
        type: enum
        class: bdev_nvme_multipath_mode
        description: 'Multipathing behavior: disable, failover, multipath. Default is failover.'
      - name: num_io_queues
        type: uint32
        description: 'The number of IO queues to request during initialization. Range: (0, UINT16_MAX + 1], Default is 1024.'
      - name: ctrlr_loss_timeout_sec
        type: int32
        description: Time to wait until ctrlr is reconnected before deleting ctrlr.  -1 means infinite reconnects. 0 means no reconnect.
      - name: reconnect_delay_sec
        type: uint32
        description: Time to delay a reconnect trial. 0 means no reconnect.
      - name: fast_io_fail_timeout_sec
        type: uint32
        description: Time to wait until ctrlr is reconnected before failing I/O to ctrlr. 0 means no such timeout.
      - name: psk
        type: string
        description: Name of the pre-shared key to be used for TLS (Enables SSL socket implementation for TCP)
      - name: max_bdevs
        type: uint32
        description: The size of the name array for newly created bdevs. Default is 128.
      - name: dhchap_key
        type: string
        description: DH-HMAC-CHAP key name (required if controller key is specified)
      - name: dhchap_ctrlr_key
        type: string
        description: DH-HMAC-CHAP controller key name.
      - name: allow_unrecognized_csi
        type: boolean
        description: Allow attaching namespaces with unrecognized command set identifiers. These will only support NVMe passthrough.
      - name: multipath_opts
        type: object
        class: bdev_nvme_multipath_opts
        description: Multipath options.
      - name: disable_sq_flow_control
        type: boolean
        description: Disable SQ flow control (set bit 2 of cattr in Fabrics Connect command).
  - name: bdev_nvme_get_controllers
    description: Get information about NVMe controllers.
    params:
      - name: name
        type: string
        description: NVMe controller name
  - name: bdev_nvme_detach_controller
    description: |
      Detach NVMe controller and delete any associated bdevs. Optionally,
      If all of the transport ID options are specified, only remove that
      transport path from the specified controller. If that is the only
      available path for the controller, this will also result in the
      controller being detached and the associated bdevs being deleted.

      returns true if the controller and bdevs were successfully destroyed
      or the address was properly removed, false otherwise.
    params:
      - name: name
        type: string
        required: true
        description: Controller name
      - name: trtype
        type: string
        description: 'NVMe-oF target trtype: rdma or tcp'
      - name: traddr
        type: string
        description: 'NVMe-oF target address: ip or BDF'
      - name: adrfam
        type: string
        description: 'NVMe-oF target adrfam: ipv4, ipv6, ib, fc, intra_host'
      - name: trsvcid
        type: string
        description: 'NVMe-oF target trsvcid: port number'
      - name: subnqn
        type: string
        description: NVMe-oF target subnqn
      - name: hostaddr
        type: string
        description: 'NVMe-oF host address: ip'
      - name: hostsvcid
        type: string
        description: 'NVMe-oF host svcid: port number'
  - name: bdev_nvme_reset_controller
    description: |
      For non NVMe multipath, reset an NVMe controller whose name is given by the `name` parameter.

      For NVMe multipath, an NVMe bdev controller is created and it aggregates multiple NVMe controllers.
      The `name` parameter is an NVMe bdev controller name and the `cntlid` parameter is used to identify
      an NVMe controller in the NVMe bdev controller. Reset only one NVMe-oF controller if the `cntlid`
      parameter is specified, or all NVMe-oF controllers in an NVMe bdev controller if it is omitted.

      Returns true if the controller reset was successful, false otherwise.
    params:
      - name: name
        type: string
        required: true
        description: NVMe controller name (or NVMe bdev controller name for multipath)
      - name: cntlid
        type: uint16
        description: NVMe controller ID (used as NVMe controller name for multipath)
  - name: bdev_nvme_enable_controller
    description: |
      For non NVMe multipath, enable an NVMe controller whose name is given by the `name` parameter.

      For NVMe multipath, an NVMe bdev controller is created and it aggregates multiple NVMe controllers.
      The `name` parameter is an NVMe bdev controller name and the `cntlid` parameter is used to identify
      an NVMe controller in the NVMe bdev controller. Enable only one NVMe-oF controller if the `cntlid`
      parameter is specified, or all NVMe-oF controllers in an NVMe bdev controller if it is omitted.

      Returns true if the controller enablement was successful or a controller was already enabled, false otherwise.
    params:
      - name: name
        type: string
        required: true
        description: NVMe controller name (or NVMe bdev controller name for multipath)
      - name: cntlid
        type: uint16
        description: NVMe controller ID (used as NVMe controller name for multipath)
  - name: bdev_nvme_disable_controller
    description: |
      For non NVMe multipath, disable an NVMe controller whose name is given by the `name` parameter.

      For NVMe multipath, an NVMe bdev controller is created and it aggregates multiple NVMe controllers.
      The `name` parameter is an NVMe bdev controller name and the `cntlid` parameter is used to identify
      an NVMe controller in the NVMe bdev controller. Disable only one NVMe-oF controller if the `cntlid`
      parameter is specified, or all NVMe-oF controllers in an NVMe bdev controller if it is omitted.

      Returns true if the controller disablement was successful or a controller was already disabled, false otherwise.
    params:
      - name: name
        type: string
        required: true
        description: NVMe controller name (or NVMe bdev controller name for multipath)
      - name: cntlid
        type: uint16
        description: NVMe controller ID (used as NVMe controller name for multipath)
  - name: bdev_nvme_start_discovery
    description: |
      Start a discovery service for the discovery subsystem of the specified transport ID.

      The discovery service will read the discovery log page for the specified
      discovery subsystem, and automatically attach to any subsystems found in the
      log page. When determining a controller name to use when attaching, it will use
      the 'name' parameter as a prefix, followed by a unique integer for that discovery
      service. If the discovery service identifies a subsystem that has been previously
      attached but is listed with a different path, it will use the same controller name
      as the previous entry, and connect as a multipath.

      When the discovery service sees that a subsystem entry has been removed
      from the log page, it will automatically detach from that controller as well.

      The 'name' is also used to later stop the discovery service.
    params:
      - name: name
        type: string
        required: true
        description: Prefix for NVMe controllers
      - name: trtype
        type: string
        required: true
        description: 'NVMe-oF target trtype: rdma or tcp'
      - name: traddr
        type: string
        required: true
        description: 'NVMe-oF target address: ip'
      - name: adrfam
        type: string
        description: 'NVMe-oF target adrfam: ipv4, ipv6'
      - name: trsvcid
        type: string
        description: 'NVMe-oF target trsvcid: port number'
      - name: hostnqn
        type: string
        description: NVMe-oF target hostnqn
      - name: wait_for_attach
        type: boolean
        description: Wait to complete until all discovered NVM subsystems are attached
      - name: attach_timeout_ms
        type: uint64
        description: Time to wait until the discovery and all discovered NVM subsystems are attached
      - name: ctrlr_loss_timeout_sec
        type: int32
        description: Time to wait until ctrlr is reconnected before deleting ctrlr.  -1 means infinite reconnects. 0 means no reconnect.
      - name: reconnect_delay_sec
        type: uint32
        description: Time to delay a reconnect trial. 0 means no reconnect.
      - name: fast_io_fail_timeout_sec
        type: uint32
        description: Time to wait until ctrlr is reconnected before failing I/O to ctrlr. 0 means no such timeout.
  - name: bdev_nvme_stop_discovery
    description: |
      Stop a discovery service. This includes detaching any controllers that were
      discovered via the service that is being stopped.
    params:
      - name: name
        type: string
        required: true
        description: Name of service to stop
  - name: bdev_nvme_get_discovery_info
    description: Get information about the discovery service.
    params: []
  - name: bdev_nvme_get_io_paths
    description: Display all or the specified NVMe bdev's active I/O paths.
    params:
      - name: name
        type: string
        description: Name of the NVMe bdev
  - name: bdev_nvme_set_preferred_path
    description: |
      Set the preferred I/O path for an NVMe bdev in multipath mode.

      NOTE: This RPC does not support NVMe bdevs in failover mode.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe bdev
      - name: cntlid
        type: uint16
        required: true
        description: NVMe-oF controller ID
  - name: bdev_nvme_set_multipath_policy
    description: |
      Set multipath policy of the NVMe bdev in multipath mode or set multipath
      selector for active-active multipath policy.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe bdev
      - name: policy
        type: enum
        class: bdev_nvme_multipath_policy
        required: true
        description: 'Multipath policy: active_active or active_passive'
      - name: selector
        type: enum
        class: bdev_nvme_multipath_selector
        description: 'Multipath selector: round_robin or queue_depth, used in active-active mode. Default is round_robin'
      - name: rr_min_io
        type: uint32
        description: Number of I/Os routed to current io path before switching to another for round-robin selector. The min value is 1.
  - name: bdev_nvme_get_path_iostat
    description: |
      Get I/O statistics for IO paths of the block device. Call RPC bdev_nvme_set_options to set enable_io_path_stat
      true before using this RPC.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe bdev
  - name: bdev_nvme_cuse_register
    description: Register CUSE device on NVMe controller.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe controller
  - name: bdev_nvme_cuse_unregister
    description: Unregister CUSE device on NVMe controller.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe controller
  - name: bdev_nvme_set_keys
    description: |
      Set DH-HMAC-CHAP keys and force (re)authentication on all connected qpairs across all multipath
      controllers.  If none of the keys are provided, the keys will be cleared, meaning that any new
      qpairs won't be authenticated.

      If successful, existing qpairs won't be disconnected/reconnected.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe controller
      - name: dhchap_key
        type: string
        description: DH-HMAC-CHAP key name (required if controller key is specified)
      - name: dhchap_ctrlr_key
        type: string
        description: DH-HMAC-CHAP controller key name
  - name: bdev_zone_block_create
    description: Creates a virtual zone device on top of existing non-zoned bdev.
    params:
      - name: name
        type: string
        required: true
        description: Name of the Zone device
      - name: base_bdev
        type: string
        required: true
        description: Name of the Base bdev
      - name: zone_capacity
        type: uint64
        required: true
        description: Zone capacity in blocks
      - name: optimal_open_zones
        type: uint64
        required: true
        description: Number of zones required to reach optimal write speed
  - name: bdev_zone_block_delete
    description: Deletes a virtual zone device.
    params:
      - name: name
        type: string
        required: true
        description: Name of the Zone device
  - name: bdev_nvme_apply_firmware
    description: Download and commit firmware to NVMe device.
    params:
      - name: filename
        type: string
        required: true
        description: filename of the firmware to download
      - name: bdev_name
        type: string
        required: true
        description: Name of the NVMe block device
  - name: bdev_nvme_get_transport_statistics
    description: Get bdev_nvme poll group transport statistics.
    params: []
  - name: bdev_nvme_get_controller_health_info
    description: Display health log of the required NVMe bdev device.
    params:
      - name: name
        type: string
        required: true
        description: Name of the NVMe bdev controller
  - name: bdev_rbd_register_cluster
    description: This method is available only if SPDK was build with Ceph RBD support.
    params:
      - name: name
        type: string
        required: true
        description: Registered Rados cluster object name
      - name: user_id
        type: string
        description: Ceph ID (i.e. admin, not client.admin)
      - name: config_param
        type: string
        description: Explicit librados configuration
      - name: config_file
        type: string
        description: File path of librados configuration file
      - name: key_file
        type: string
        description: File path of librados key file
      - name: core_mask
        type: string
        description: Core mask for librados IO context threads
  - name: bdev_rbd_unregister_cluster
    description: |
      This method is available only if SPDK was build with Ceph RBD support.
      If there is still rbd bdev using this cluster, the unregisteration operation
      will fail.
    params:
      - name: name
        type: string
        required: true
        description: Rados cluster object name
  - name: bdev_rbd_get_clusters_info
    description: This method is available only if SPDK was build with Ceph RBD support.
    params:
      - name: name
        type: string
        description: Rados cluster object name
  - name: bdev_rbd_create
    description: |
      Create @ref bdev_config_rbd bdev

      This method is available only if SPDK was build with Ceph RBD support.
    params:
      - name: name
        type: string
        description: Bdev name
      - name: user_id
        type: string
        description: Ceph ID (i.e. admin, not client.admin)
      - name: pool_name
        type: string
        required: true
        description: Pool name
      - name: rbd_name
        type: string
        required: true
        description: Image name
      - name: block_size
        type: uint32
        required: true
        description: Block size
      - name: config
        type: string
        description: Explicit librados configuration
      - name: cluster_name
        type: string
        description: Rados cluster object name created in this module.
      - name: uuid
        type: uuid
        description: UUID of new bdev
      - name: read_only
        type: boolean
        description: set rbd bdev as read-only
  - name: bdev_rbd_delete
    description: |
      Delete @ref bdev_config_rbd bdev

      This method is available only if SPDK was build with Ceph RBD support.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_rbd_resize
    description: |
      Resize @ref bdev_config_rbd bdev

      This method is available only if SPDK was build with Ceph RBD support.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: new_size
        type: uint64
        required: true
        description: New bdev size for resize operation in MiB
  - name: bdev_delay_create
    description: |
      Create delay bdev. This bdev type redirects all IO to it's base bdev and inserts a delay on the completion
      path to create an artificial drive latency. All latency values supplied to this bdev should be in microseconds.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: base_bdev_name
        type: string
        required: true
        description: Base bdev name
      - name: avg_read_latency
        type: uint64
        required: true
        description: average read latency (us)
      - name: p99_read_latency
        type: uint64
        required: true
        description: p99 read latency (us)
      - name: avg_write_latency
        type: uint64
        required: true
        description: average write latency (us)
      - name: p99_write_latency
        type: uint64
        required: true
        description: p99 write latency (us)
      - name: uuid
        type: uuid
        description: UUID of new bdev
  - name: bdev_delay_delete
    description: Delete delay bdev.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_delay_update_latency
    description: |
      Update a target latency value associated with a given delay bdev. Any currently
      outstanding I/O will be completed with the old latency.
    params:
      - name: delay_bdev_name
        type: string
        required: true
        description: Name of the delay bdev
      - name: latency_type
        type: enum
        class: bdev_delay_latency_type
        required: true
        description: Latency bucket to update
      - name: latency_us
        type: uint64
        required: true
        description: The new latency value in microseconds
  - name: bdev_error_create
    description: Construct error bdev.
    params:
      - name: base_name
        type: string
        required: true
        description: Base bdev name
      - name: uuid
        type: uuid
        description: UUID for this bdev
  - name: bdev_error_delete
    description: Delete error bdev
    params:
      - name: name
        type: string
        required: true
        description: Error bdev name
  - name: bdev_error_inject_error
    description: |
      Inject an error via an error bdev. Create an error bdev on base bdev first. Default 'num'
      value is 1 and if 'num' is set to zero, the specified injection is disabled.
    params:
      - name: name
        type: string
        required: true
        description: Name of the error injection bdev
      - name: io_type
        type: enum
        class: bdev_error_inject_io_type
        required: true
        description: io type 'clear' 'read' 'write' 'unmap' 'flush' 'all'
      - name: error_type
        type: enum
        class: bdev_error_inject_error_type
        required: true
        description: error type 'failure' 'nvme_failure' 'pending' 'corrupt_data' 'nomem'
      - name: nvme_sct
        type: uint32
        required: false
        description: the NVMe SCT error for 'nvme_failure' type (default:0)
      - name: nvme_sc
        type: uint32
        required: false
        description: the NVMe SC error for 'nvme_failure' type (default:0)
      - name: num
        type: uint32
        description: the number of commands you want to fail.(default:1)
      - name: queue_depth
        type: uint64
        description: the queue depth at which to trigger the error
      - name: corrupt_offset
        type: uint64
        description: the offset in bytes to xor with corrupt_value
      - name: corrupt_value
        type: uint8
        description: the value for xor (1-255, 0 is invalid)
  - name: bdev_error_resume_pending
    description: Resume all error bdev pending requests.
    params:
      - name: name
        type: string
        required: true
        description: Name of the error injection bdev
  - name: bdev_iscsi_set_options
    description: 'This RPC can be called at any time, but the new value will only take effect for new iSCSI bdevs.'
    params:
      - name: timeout_sec
        type: uint64
        description: Timeout for command, in seconds, if 0, don't track timeout
  - name: bdev_iscsi_create
    description: |
      Connect to iSCSI target and create bdev backed by this connection.

      This method is available only if SPDK was build with iSCSI initiator support.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: initiator_iqn
        type: string
        required: true
        description: IQN name used during connection
      - name: url
        type: string
        required: true
        description: iSCSI resource URI
  - name: bdev_iscsi_delete
    description: |
      Delete iSCSI bdev and terminate connection to target.

      This method is available only if SPDK was built with iSCSI initiator support.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_ftl_create
    description: |
      Create FTL bdev.

      This RPC is subject to change.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: base_bdev
        type: string
        required: true
        description: Name of the base device
      - name: cache
        type: string
        required: true
        description: Name of the cache device
      - name: uuid
        type: uuid
        description: UUID of restored bdev (not applicable when creating new instance)
      - name: core_mask
        type: string
        description: CPU core(s) possible for placement of the ftl core thread, application main thread by default
      - name: overprovisioning
        type: uint64
        description: Percentage of base device used for relocation, 20% by default
      - name: fast_shutdown
        type: boolean
        description: When set FTL will minimize persisted data on target application shutdown and rely on shared memory during next load
      - name: l2p_dram_limit
        type: uint64
        description: DRAM limit for most recent L2P addresses (default 2048 MiB)
  - name: bdev_ftl_delete
    description: |
      Delete FTL bdev.

      This RPC is subject to change.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: fast_shutdown
        type: boolean
        description: When set FTL will minimize persisted data during deletion and rely on shared memory during next load
  - name: bdev_ftl_unmap
    description: |
      Unmap range of LBAs.

      This RPC is subject to change.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: lba
        type: uint64
        required: true
        description: start lba, aligned to 1024
      - name: num_blocks
        type: uint64
        required: true
        description: number of blocks, aligned to 1024
  - name: bdev_ftl_get_stats
    description: |
      Get IO statistics for FTL bdev

      This RPC is subject to change.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_ftl_get_properties
    description: Get FTL properties
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_ftl_set_property
    description: Set FTL property. Trying to set a read-only property will result in an error.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: ftl_property
        type: string
        required: true
        description: Name of the property to modify
      - name: value
        type: string
        required: true
        description: New value of the property to be set
  - name: bdev_passthru_create
    description: |
      Create passthru bdev. This bdev type redirects all IO to it's base bdev. It has no other purpose than being an example
      and a starting point in development of new bdev type.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
      - name: base_bdev_name
        type: string
        required: true
        description: Base bdev name
      - name: uuid
        type: uuid
        description: UUID of new bdev
  - name: bdev_passthru_delete
    description: Delete passthru bdev.
    params:
      - name: name
        type: string
        required: true
        description: Bdev name
  - name: bdev_xnvme_create
    description: Create xnvme bdev. This bdev type redirects all IO to its underlying backend.
    params:
      - name: name
        type: string
        required: true
        description: name of xNVMe bdev to create
      - name: filename
        type: string
        required: true
        description: 'path to device or file (ex: /dev/nvme0n1)'
      - name: io_mechanism
        type: string
        required: true
        description: 'IO mechanism to use (ex: libaio, io_uring, io_uring_cmd, etc.)'
      - name: conserve_cpu
        type: boolean
        description: 'Whether or not to conserve CPU when polling (default: false)'
  - name: bdev_xnvme_delete
    description: Delete xnvme bdev.
    params:
      - name: name
        type: string
        required: true
        description: name of xnvme bdev to delete
  - name: bdev_virtio_attach_controller
    description: 'Create new initiator @ref bdev_config_virtio_scsi or @ref bdev_config_virtio_blk and expose all found bdevs.'
    params:
      - name: name
        type: string
        required: true
        description: Prefix used to name the resulting bdev(s)
      - name: trtype
        type: enum
        class: bdev_virtio_trtype
        required: true
        description: Virtio transport type
      - name: traddr
        type: string
        required: true
        description: Transport-specific address (PCI BDF for pci; UNIX socket path for user and vfio-user)
      - name: dev_type
        type: enum
        class: bdev_virtio_dev_type
        required: true
        description: Virtio device type
      - name: vq_count
        type: uint32
        description: 'Number of virtqueues (user transport only). Default: 1'
      - name: vq_size
        type: uint32
        description: 'Entries per virtqueue, must be a power of 2 (user transport only). Default: 512'
  - name: bdev_virtio_scsi_get_devices
    description: Show information about all available Virtio SCSI devices.
    params: []
  - name: bdev_virtio_detach_controller
    description: Remove a Virtio device. This command can be used to remove any type of virtio device.
    params:
      - name: name
        type: string
        required: true
        description: Name of the virtio bdev (e.g. "VirtioUser0")
  - name: bdev_virtio_blk_set_hotplug
    description: Enable/Disable the virtio blk hotplug monitor or change the monitor period time
    params:
      - name: enable
        type: boolean
        required: true
        description: Enable the virtio-blk hotplug monitor
      - name: period_us
        type: uint64
        description: Hotplug polling period in microseconds
  - name: iscsi_set_options
    description: |
      Set global parameters for iSCSI targets.

      This RPC may only be called before SPDK subsystems have been initialized. This RPC can be called only once.
    params:
      - name: auth_file
        type: string
        description: Path to CHAP shared secret file
      - name: node_base
        type: string
        description: Prefix of the name of iSCSI target node
      - name: nop_timeout
        type: int32
        description: NOP-In request timeout to the initiator in seconds
      - name: nop_in_interval
        type: int32
        description: Interval between NOP-In requests from the target in seconds
      - name: disable_chap
        type: boolean
        description: Disable CHAP for discovery session
      - name: require_chap
        type: boolean
        description: Require CHAP for discovery session
      - name: mutual_chap
        type: boolean
        description: Enable bidirectional CHAP for discovery session
      - name: chap_group
        type: int32
        description: CHAP authentication group ID for discovery session (non-zero values must reference a precreated group)
      - name: max_sessions
        type: uint32
        description: Maximum number of sessions in the host
      - name: max_queue_depth
        type: uint32
        description: Maximum number of outstanding I/Os per queue
      - name: max_connections_per_session
        type: uint32
        description: Negotiated MaxConnections value per session
      - name: default_time2wait
        type: uint32
        description: Negotiated DefaultTime2Wait value in seconds
      - name: default_time2retain
        type: uint32
        description: Negotiated DefaultTime2Retain value in seconds
      - name: first_burst_length
        type: uint32
        description: Negotiated FirstBurstLength value in bytes
      - name: immediate_data
        type: boolean
        description: Negotiated ImmediateData value
      - name: error_recovery_level
        type: uint32
        description: Negotiated ErrorRecoveryLevel value
      - name: allow_duplicated_isid
        type: boolean
        description: Allow duplicated initiator session ID
      - name: max_large_datain_per_connection
        type: uint32
        description: Maximum number of outstanding split read I/Os per connection
      - name: max_r2t_per_connection
        type: uint32
        description: Maximum number of outstanding R2Ts per connection
      - name: pdu_pool_size
        type: uint32
        description: Number of PDUs in the pool
      - name: immediate_data_pool_size
        type: uint32
        description: Number of immediate data buffers in the pool
      - name: data_out_pool_size
        type: uint32
        description: Number of data out buffers in the pool
  - name: iscsi_get_options
    description: Show global parameters of iSCSI targets.
    params: []
  - name: scsi_get_devices
    description: Display SCSI devices
    params: []
  - name: iscsi_set_discovery_auth
    description: Set CHAP authentication for sessions dynamically.
    params:
      - name: disable_chap
        type: boolean
        description: Disable CHAP for discovery session
      - name: require_chap
        type: boolean
        description: Require CHAP for discovery session
      - name: mutual_chap
        type: boolean
        description: Enable bidirectional CHAP for discovery session
      - name: chap_group
        type: int32
        description: CHAP authentication group ID for discovery session (non-zero values must reference a precreated group)
  - name: iscsi_create_auth_group
    description: Create an authentication group for CHAP authentication.
    params:
      - name: tag
        type: int32
        required: true
        description: Authentication group tag (unique, integer > 0)
      - name: secrets
        type: array
        class: iscsi_auth_secrets
        description: |-
          Comma-separated list of CHAP secrets
          (user:user_name secret:chap_secret muser:mutual_user_name msecret:mutual_chap_secret) enclosed in quotes.
          Format: 'user:u1 secret:s1 muser:mu1 msecret:ms1,user:u2 secret:s2 muser:mu2 msecret:ms2'
  - name: iscsi_delete_auth_group
    description: Delete an existing authentication group for CHAP authentication.
    params:
      - name: tag
        type: int32
        required: true
        description: Authentication group tag (unique, integer > 0)
  - name: iscsi_get_auth_groups
    description: Show information about all existing authentication group for CHAP authentication.
    params: []
  - name: iscsi_auth_group_add_secret
    description: Add a secret to an existing authentication group for CHAP authentication.
    params:
      - name: tag
        type: int32
        required: true
        description: Authentication group tag (unique, integer > 0)
      - name: user
        type: string
        required: true
        description: User name for one-way (unidirectional) CHAP authentication
      - name: secret
        type: string
        required: true
        description: Secret for one-way (unidirectional) CHAP authentication
      - name: muser
        type: string
        description: User name for mutual (bidirectional) CHAP authentication
      - name: msecret
        type: string
        description: Secret for mutual (bidirectional) CHAP authentication
  - name: iscsi_auth_group_remove_secret
    description: Remove a secret from an existing authentication group for CHAP authentication.
    params:
      - name: tag
        type: int32
        required: true
        description: Authentication group tag (unique, integer > 0)
      - name: user
        type: string
        required: true
        description: User name for one-way (unidirectional) CHAP authentication
  - name: iscsi_get_initiator_groups
    description: Show information about all available initiator groups.
    params: []
  - name: iscsi_create_initiator_group
    description: Add an initiator group.
    params:
      - name: tag
        type: int32
        required: true
        description: Initiator group tag (unique, integer > 0)
      - name: initiators
        type: array
        class: iscsi_initiators
        required: true
        description: |-
          Whitespace-separated list of initiator hostnames or IP addresses,
          enclosed in quotes.  Example: 'ANY' or 'iqn.2016-06.io.spdk:host1 iqn.2016-06.io.spdk:host2'
      - name: netmasks
        type: array
        class: iscsi_netmasks
        required: true
        description: |-
          Whitespace-separated list of initiator netmasks enclosed in quotes.
          Example: '255.255.0.0 255.248.0.0' etc
  - name: iscsi_delete_initiator_group
    description: Delete an existing initiator group.
    params:
      - name: tag
        type: int32
        required: true
        description: Initiator group tag (unique, integer > 0)
  - name: iscsi_initiator_group_add_initiators
    description: Add initiators to an existing initiator group.
    params:
      - name: tag
        type: int32
        required: true
        description: Initiator group tag (unique, integer > 0)
      - name: initiators
        type: array
        class: iscsi_initiators
        description: |-
          Whitespace-separated list of initiator hostnames or IP addresses,
          enclosed in quotes.  This parameter can be omitted.  Example: 'ANY' or
          'iqn.2016-06.io.spdk:host1 iqn.2016-06.io.spdk:host2'
      - name: netmasks
        type: array
        class: iscsi_netmasks
        description: |-
          Whitespace-separated list of initiator netmasks enclosed in quotes.
          This parameter can be omitted.  Example: '255.255.0.0 255.248.0.0' etc
  - name: iscsi_initiator_group_remove_initiators
    description: Remove initiators from an initiator group.
    params:
      - name: tag
        type: int32
        required: true
        description: Initiator group tag (unique, integer > 0)
      - name: initiators
        type: array
        class: iscsi_initiators
        description: |-
          Whitespace-separated list of initiator hostnames or IP addresses,
          enclosed in quotes.  This parameter can be omitted.  Example: 'ANY' or
          'iqn.2016-06.io.spdk:host1 iqn.2016-06.io.spdk:host2'
      - name: netmasks
        type: array
        class: iscsi_netmasks
        description: |-
          Whitespace-separated list of initiator netmasks enclosed in quotes.
          This parameter can be omitted.  Example: '255.255.0.0 255.248.0.0' etc
  - name: iscsi_get_target_nodes
    description: Show information about all available iSCSI target nodes.
    params: []
  - name: iscsi_create_target_node
    description: Add an iSCSI target node.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: alias_name
        type: string
        required: true
        description: Target node alias name (ASCII)
      - name: pg_ig_maps
        type: array
        class: iscsi_pg_ig_maps
        required: true
        description: |-
          List of (Portal_Group_Tag:Initiator_Group_Tag) mappings
          Whitespace separated, quoted, mapping defined with colon
          separated list of "tags" (int > 0)
          Example: '1:1 2:2 2:1'
          *** The Portal/Initiator Groups must be precreated ***
      - name: luns
        type: array
        class: scsi_luns
        required: true
        description: |-
          Whitespace-separated list of (bdev name:LUN ID) pairs enclosed
          in quotes.  Format:  'bdev_name0:id0 bdev_name1:id1' etc
          Example: 'Malloc0:0 Malloc1:1 Malloc5:2'
          *** The bdevs must pre-exist ***
          *** LUN0 (id = 0) is required ***
          *** bdevs names cannot contain space or colon characters ***
      - name: queue_depth
        type: int32
        required: true
        description: Target queue depth
      - name: disable_chap
        type: boolean
        description: Disable CHAP authentication for this target node
      - name: require_chap
        type: boolean
        description: Require CHAP authentication for this target node
      - name: mutual_chap
        type: boolean
        description: Enable bidirectional CHAP authentication for this target node
      - name: chap_group
        type: int32
        description: Authentication group ID for this target node (non-zero values must reference a precreated group)
      - name: header_digest
        type: boolean
        description: Require Header Digest for this target node
      - name: data_digest
        type: boolean
        description: Require Data Digest for this target node
  - name: iscsi_target_node_set_auth
    description: Set CHAP authentication to an existing iSCSI target node.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: disable_chap
        type: boolean
        description: Disable CHAP authentication for this target node
      - name: require_chap
        type: boolean
        description: Require CHAP authentication for this target node
      - name: mutual_chap
        type: boolean
        description: Enable bidirectional CHAP authentication for this target node
      - name: chap_group
        type: int32
        description: Authentication group ID for this target node (non-zero values must reference a precreated group)
  - name: iscsi_target_node_add_pg_ig_maps
    description: Add initiator group to portal group mappings to an existing iSCSI target node.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: pg_ig_maps
        type: array
        class: iscsi_pg_ig_maps
        required: true
        description: |-
          List of (Portal_Group_Tag:Initiator_Group_Tag) mappings
          Whitespace separated, quoted, mapping defined with colon
          separated list of "tags" (int > 0)
          Example: '1:1 2:2 2:1'
          *** The Portal/Initiator Groups must be precreated ***
  - name: iscsi_target_node_remove_pg_ig_maps
    description: Delete initiator group to portal group mappings from an existing iSCSI target node.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: pg_ig_maps
        type: array
        class: iscsi_pg_ig_maps
        required: true
        description: |-
          List of (Portal_Group_Tag:Initiator_Group_Tag) mappings
          Whitespace separated, quoted, mapping defined with colon
          separated list of "tags" (int > 0)
          Example: '1:1 2:2 2:1'
          *** The Portal/Initiator Groups must be precreated ***
  - name: iscsi_delete_target_node
    description: Delete an iSCSI target node.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
  - name: iscsi_get_portal_groups
    description: Show information about all available portal groups.
    params: []
  - name: iscsi_create_portal_group
    description: Add a portal group.
    params:
      - name: tag
        type: int32
        required: true
        description: Portal group tag (unique, integer > 0)
      - name: portals
        type: array
        class: iscsi_portals
        required: true
        description: |-
          List of portals in host:port format, separated by whitespace
          Example: '192.168.100.100:3260 192.168.100.100:3261 192.168.100.100:3262'
      - name: private
        type: boolean
        description: |-
          Public (false) or private (true) portal group.
          Private portal groups do not have their portals returned by a discovery session. A public
          portal group may optionally specify a redirect portal for non-discovery logins. This redirect
          portal must be from a private portal group.
      - name: wait
        type: boolean
        description: |-
          Do not listen on portals until started explicitly.
          One major iSCSI initiator may not retry login once it failed. Hence for such initiator, listening
          on portals should be allowed after all associated target nodes are created.
  - name: iscsi_start_portal_group
    description: |
      Start listening on portals if the portal group is not started yet, or do nothing
      if the portal group already started. Return a success response for both cases.
    params:
      - name: tag
        type: int32
        required: true
        description: Portal group tag (unique, integer > 0)
  - name: iscsi_delete_portal_group
    description: Delete an existing portal group.
    params:
      - name: tag
        type: int32
        required: true
        description: Portal group tag (unique, integer > 0)
  - name: iscsi_portal_group_set_auth
    description: |
      Set CHAP authentication for discovery sessions specific for the existing iSCSI portal group.
      This RPC overwrites the setting by the global parameters for the iSCSI portal group.
    params:
      - name: tag
        type: int32
        required: true
        description: Portal group tag (unique, integer > 0)
      - name: disable_chap
        type: boolean
        description: Disable CHAP authentication for this portal group
      - name: require_chap
        type: boolean
        description: Require CHAP authentication for this portal group
      - name: mutual_chap
        type: boolean
        description: Enable bidirectional CHAP authentication for this portal group
      - name: chap_group
        type: int32
        description: CHAP authentication group ID for this portal group (non-zero values must reference a precreated group)
  - name: iscsi_get_connections
    description: Show information about all active connections.
    params: []
  - name: iscsi_get_stats
    description: Show stat information of iSCSI connections.
    params: []
  - name: iscsi_target_node_add_lun
    description: Add an LUN to an existing iSCSI target node.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: bdev_name
        type: string
        required: true
        description: bdev name to be added as a LUN (must not contain spaces or colons)
      - name: lun_id
        type: int32
        description: LUN ID. -1 or omitted assigns the lowest free ID
  - name: iscsi_target_node_set_redirect
    description: 'Update redirect portal of the primary portal group for the target node,'
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: pg_tag
        type: int32
        required: true
        description: Portal group tag (unique, integer > 0)
      - name: redirect_host
        type: string
        description: Numeric IP address of the redirect portal
      - name: redirect_port
        type: string
        description: Numeric TCP port of the redirect portal
  - name: iscsi_target_node_request_logout
    description: |
      For the target node, request connections whose portal group tag match to logout,
      or request all connections to logout if portal group tag is omitted.
    params:
      - name: name
        type: string
        required: true
        description: Target node name (ASCII)
      - name: pg_tag
        type: int32
        description: Portal group tag (unique, integer > 0)
  - name: iscsi_enable_histogram
    description: Control whether collecting data for histogram is enabled for specified iscsi target node.
    params:
      - name: name
        type: string
        required: true
        description: iSCSI target node name
      - name: enable
        type: boolean
        required: true
        description: Enable or disable histogram for the specified iSCSI target node
  - name: iscsi_get_histogram
    description: Get latency histogram for specified iscsi target node.
    params:
      - name: name
        type: string
        required: true
        description: iSCSI target node name
  - name: nvmf_create_target
    description: ""
    private: true
    params:
      - name: name
        type: string
        required: true
        description: Target name (unique to application)
      - name: max_subsystems
        type: uint32
        description: 'Max number of NVMf subsystems (default: SPDK_NVMF_DEFAULT_MAX_SUBSYSTEMS)'
      - name: discovery_filter
        type: bitmask
        class: nvmf_discovery_filters
        description: 'Comma-separated list of discovery filters: transport, address, svcid'
      - name: dup_host_policy
        type: enum
        class: nvmf_dup_host_policy
        description: Duplicate host policy
  - name: nvmf_delete_target
    description: ""
    private: true
    params:
      - name: name
        type: string
        required: true
        description: Target name
  - name: nvmf_get_targets
    description: ""
    private: true
    params: []
  - name: nvmf_create_transport
    description: Initialize an NVMe-oF transport with the given options.
    params:
      - name: trtype
        type: string
        required: true
        description: Transport type (ex. RDMA)
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: max_queue_depth
        type: uint16
        description: Max number of outstanding I/O per queue
      - name: max_io_qpairs_per_ctrlr
        type: uint16
        description: Max number of IO qpairs per controller
      - name: in_capsule_data_size
        type: uint32
        description: Max number of in-capsule data size
      - name: max_io_size
        type: uint32
        description: Max I/O size (bytes)
      - name: io_unit_size
        type: uint32
        deprecated: true
        description: I/O unit size (bytes). Deprecated, use iobuf_set_options instead.
      - name: max_aq_depth
        type: uint32
        description: Max number of admin cmds per AQ
      - name: num_shared_buffers
        type: uint32
        deprecated: true
        description: Number of pooled data buffers available to the transport. Deprecated, use iobuf_set_options instead
      - name: buf_cache_size
        type: uint32
        deprecated: true
        description: |-
          The number of shared buffers to reserve for each poll group.
          Deprecated, use iobuf-small-cache-size instead
      - name: iobuf_small_cache_size
        type: uint32
        description: The number of shared buffers from a small iobuf pool to reserve for each poll group
      - name: iobuf_large_cache_size
        type: uint32
        description: Number of shared buffers from the large iobuf pool to reserve for each poll group
      - name: zcopy
        type: boolean
        description: Use zero-copy operations if the underlying bdev supports them
      - name: num_cqe
        type: int32
        description: Number of CQ entries, only used when no_srq=true (RDMA only)
      - name: max_srq_depth
        type: uint32
        description: Number of elements in the per-thread shared receive queue (RDMA only)
      - name: no_srq
        type: boolean
        description: Disable shared receive queue even for devices that support it (RDMA only)
      - name: c2h_success
        type: boolean
        description: Disable C2H success optimization (TCP only)
      - name: dif_insert_or_strip
        type: boolean
        description: Enable DIF insert for write I/O and DIF strip for read I/O (TCP only)
      - name: sock_priority
        type: uint32
        description: Socket priority of connections owned by this transport (TCP only)
      - name: acceptor_backlog
        type: int32
        description: Number of pending connections allowed in the backlog before failing new connection attempts (RDMA only)
      - name: abort_timeout_sec
        type: uint32
        description: Abort execution timeout value, in seconds
      - name: no_wr_batching
        type: boolean
        description: Disable work requests batching (RDMA only)
      - name: control_msg_num
        type: uint16
        description: Number of control messages per poll group (TCP only)
      - name: disable_mappable_bar0
        type: boolean
        description: Disable client mmap() of BAR0 (VFIO-USER only)
      - name: disable_adaptive_irq
        type: boolean
        description: Disable adaptive interrupt feature (VFIO-USER only)
      - name: disable_shadow_doorbells
        type: boolean
        description: Disable shadow doorbell support (VFIO-USER only)
      - name: acceptor_poll_rate
        type: uint32
        description: Polling interval of the acceptor for incoming connections (microseconds)
      - name: ack_timeout
        type: uint32
        description: ACK timeout in milliseconds
      - name: data_wr_pool_size
        type: uint32
        description: RDMA data WR pool size (RDMA only)
      - name: disable_command_passthru
        type: boolean
        description: Disallow forwarding unrecognized I/O opcodes and the Identify Namespace admin command to the underlying bdev. Passthrough subsystems and admin_cmd_passthru are unaffected
      - name: kas
        type: uint16
        description: KATO (Keep Alive Timeout) granularity in units of 100 milliseconds
      - name: min_kato
        type: uint32
        description: Minimum Keep Alive Timeout value in milliseconds
      - name: masked_oncs
        type: bitmask
        class: oncs_features
        required: false
        description: 'Comma-separated list of ONCS features to mask (disable). Available options: all, nvmcmps, nvmdsmsv, nvmwzsv, reservs, nvmcpys'
      - name: masked_fuses
        type: bitmask
        class: fuses_features
        required: false
        description: 'Comma-separated list of FUSES features to mask (disable). Available options: all, fcws'
  - name: nvmf_get_subsystems
    description: ""
    params:
      - name: nqn
        type: string
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_create_subsystem
    description: Construct an NVMe over Fabrics target subsystem.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: serial_number
        type: string
        description: Serial number of the virtual NVMe controller
      - name: model_number
        type: string
        description: Model number of the virtual NVMe controller
      - name: admin_label
        type: string
        description: Admin label for extended discovery log page entry (4-256 ASCII characters)
      - name: max_namespaces
        type: uint32
        description: Maximum number of namespaces that can be attached to the subsystem
      - name: allow_any_host
        type: boolean
        description: 'Allow any host to connect (default: enforce allowed host NQN list)'
      - name: ana_reporting
        type: boolean
        description: Enable ANA reporting feature
      - name: min_cntlid
        type: uint16
        description: Minimum controller ID
      - name: max_cntlid
        type: uint16
        description: Maximum controller ID
      - name: dmrsl
        type: uint32
        description: Dataset Management Range Size Limit in logical block units
      - name: wzsl
        type: uint8
        description: Write Zeroes Size Limit as a power of two (2^wzsl) in units of minimum memory page size
      - name: passthrough
        type: boolean
        description: Use NVMe passthrough for all I/O commands and namespace-directed admin commands
      - name: enable_nssr
        type: boolean
        description: Enable NSSR (NVMe subsystem reset)
  - name: nvmf_delete_subsystem
    description: Delete an existing NVMe-oF subsystem.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_add_listener
    description: |
      Add a new listen address to an NVMe-oF subsystem.

      This method will fail if listener with given address already exists.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN ('discovery' can be used as shortcut for discovery NQN)
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: listen_address
        type: object
        required: true
        class: nvmf_listen_address
        description: '@ref rpc_nvmf_listen_address object'
      - name: secure_channel
        type: boolean
        description: Require all connections to immediately establish a secure channel
      - name: ana_state
        type: enum
        class: nvme_ana_state
        description: ANA state to set
      - name: sock_impl
        type: string
        description: Socket implementation to use for the listener
      - name: numa_id
        type: int32
        required: false
        description: Required NUMA node ID for all namespaces, if -1 then any namespace can be used. Default is -1. Relevant only for VFIOUSER transport.
  - name: nvmf_subsystem_remove_listener
    description: Remove a listen address from an NVMe-oF subsystem.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN ('discovery' can be used as shortcut for discovery NQN)
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: listen_address
        type: object
        required: true
        class: nvmf_listen_address
        description: '@ref rpc_nvmf_listen_address object'
  - name: nvmf_subsystem_listener_set_ana_state
    description: |
      Set ANA state of a listener for an NVMe-oF subsystem. Only the ANA state of the specified ANA
      group is updated, or ANA states of all ANA groups if ANA group is not specified.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: listen_address
        type: object
        required: true
        class: nvmf_listen_address
        description: '@ref rpc_nvmf_listen_address object'
      - name: ana_state
        type: enum
        class: nvme_ana_state
        required: true
        description: ANA state to set
      - name: anagrpid
        type: uint32
        description: ANA group ID
  - name: nvmf_subsystem_add_ns
    description: Add a namespace to a subsystem. The namespace ID is returned as the result.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: namespace
        type: object
        required: true
        class: nvmf_namespace
        description: '@ref rpc_nvmf_namespace object'
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_remove_ns
    description: Remove a namespace from a subsystem.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: nsid
        type: uint32
        required: true
        description: Namespace ID
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_set_ns_ana_group
    description: Change ANA group ID of a namespace in a subsystem.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: nsid
        type: uint32
        required: true
        description: Namespace ID
      - name: anagrpid
        type: uint32
        required: true
        description: ANA group ID
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_add_host
    description: |
      Add a host NQN to the list of allowed hosts.  Adding an already allowed host will result in an
      error.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: host
        type: string
        required: true
        description: Host NQN to add to the allowed host list
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: psk
        type: string
        description: Pre-shared key name for TLS authentication (TCP only)
      - name: dhchap_key
        type: string
        description: DH-HMAC-CHAP key name, required if a controller key is specified
      - name: dhchap_ctrlr_key
        type: string
        description: DH-HMAC-CHAP controller key name
  - name: nvmf_subsystem_remove_host
    description: Remove a host NQN from the list of allowed hosts.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: host
        type: string
        required: true
        description: Host NQN to remove from the allowed host list
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: timeout_ms
        type: uint64
        description: Timeout in ms to wait for I/Os to complete (optional). Default value is derived from the controller CAP.TO.
  - name: nvmf_subsystem_allow_any_host
    description: Configure a subsystem to allow any host to connect or to enforce the host NQN list.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: allow_any_host
        type: boolean
        required: true
        description: Allow any host to connect (`true`) or enforce allowed host NQN list (`false`)
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_set_keys
    description: |
      Set keys required for a host to connect to a given subsystem.  This will overwrite the keys set by
      `nvmf_subsystem_add_host`.  If none of the keys are provided, host's keys will be cleared, allowing
      it to connect without authentication.
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: host
        type: string
        required: true
        description: Host NQN
      - name: tgt_name
        type: string
        description: NVMe-oF target name
      - name: dhchap_key
        type: string
        description: DH-HMAC-CHAP key name, required if a controller key is specified
      - name: dhchap_ctrlr_key
        type: string
        description: DH-HMAC-CHAP controller key name
  - name: nvmf_subsystem_get_controllers
    description: ""
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_get_qpairs
    description: ""
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_subsystem_get_listeners
    description: ""
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_ns_add_host
    description: |
      Make the specified namespace of the specified subnqn visible to any existing
      or future controllers with the specified hostnqn.

      Note: the namespace must have been added with no_auto_visible = false
      (see @ref rpc_nvmf_subsystem_add_ns).
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: nsid
        type: uint32
        required: true
        description: Namespace ID
      - name: host
        type: string
        required: true
        description: Host NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_ns_remove_host
    description: |
      Make the specified namespace of the specified subnqn not visible to any existing
      or future controllers with the specified hostnqn.

      Note: the namespace must have been added to the subsystem with
      no_auto_visible = false (see @ref rpc_nvmf_subsystem_add_ns).
    params:
      - name: nqn
        type: string
        required: true
        description: Subsystem NQN
      - name: nsid
        type: uint32
        required: true
        description: Namespace ID
      - name: host
        type: string
        required: true
        description: Host NQN
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_set_max_subsystems
    description: |
      Set the maximum allowed subsystems for the NVMe-oF target.  This RPC may only be called
      before SPDK subsystems have been initialized.
    params:
      - name: max_subsystems
        type: uint32
        required: true
        description: Maximum number of NVMe-oF subsystems
  - name: nvmf_discovery_add_referral
    description: |
      Add a discovery service referral to an NVMe-oF target. If a referral with the given
      parameters already exists, no action will be taken.
    params:
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: address
        type: object
        required: true
        class: nvmf_listen_address
        description: '@ref rpc_nvmf_listen_address object'
      - name: secure_channel
        type: boolean
        description: The connection to that discovery subsystem requires a secure channel
      - name: subnqn
        type: string
        description: Subsystem NQN
  - name: nvmf_discovery_remove_referral
    description: Remove a discovery service referral from an NVMe-oF target.
    params:
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: address
        type: object
        required: true
        class: nvmf_listen_address
        description: '@ref rpc_nvmf_listen_address object'
      - name: subnqn
        type: string
        description: Subsystem NQN
  - name: nvmf_discovery_get_referrals
    description: ""
    params:
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_set_config
    description: |
      Set global configuration of NVMe-oF target.  This RPC may only be called before SPDK subsystems
      have been initialized.
    params:
      - name: admin_cmd_passthru
        type: object
        class: nvmf_admin_cmd_passthru
        description: Admin command passthru configuration
      - name: poll_groups_mask
        type: string
        description: CPU mask for NVMe-oF poll groups
      - name: discovery_filter
        type: string
        deprecated: true
        description: Deprecated, use discovery_filters instead
      - name: discovery_filters
        type: bitmask
        class: nvmf_discovery_filters
        description: Comma-separated list of discovery filters
      - name: dhchap_digests
        type: bitmask
        class: dhchap_digests
        description: Comma-separated list of allowed DH-HMAC-CHAP digests
      - name: dhchap_dhgroups
        type: bitmask
        class: dhchap_dhgroups
        description: Comma-separated list of allowed DH-HMAC-CHAP DH groups
      - name: dup_host_policy
        type: enum
        class: nvmf_dup_host_policy
        description: Duplicate host policy
  - name: nvmf_get_transports
    description: ""
    params:
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
      - name: trtype
        type: string
        description: Transport type
  - name: nvmf_get_stats
    description: Retrieve current statistics of the NVMf subsystem.
    params:
      - name: tgt_name
        type: string
        description: Parent NVMe-oF target name
  - name: nvmf_set_crdt
    description: |
      Set the 3 CRDT (Command Retry Delay Time) values. For details about
      CRDT, please refer to the NVMe specification. Currently all the
      SPDK nvmf subsystems share the same CRDT values. The default values
      are 0. This rpc can only be invoked in STARTUP stage. All values are
      in units of 100 milliseconds (same as the NVMe specification).
    params:
      - name: crdt1
        type: uint16
        description: Command Retry Delay Time 1 in units of 100 milliseconds
      - name: crdt2
        type: uint16
        description: Command Retry Delay Time 2 in units of 100 milliseconds
      - name: crdt3
        type: uint16
        description: Command Retry Delay Time 3 in units of 100 milliseconds
  - name: vfu_tgt_set_base_path
    description: Set base path of Unix Domain socket file.
    params:
      - name: path
        type: string
        required: true
        description: Base path for the vfio-user UNIX sockets
  - name: vfu_virtio_delete_endpoint
    description: Delete PCI device via endpoint name.
    params:
      - name: name
        type: string
        required: true
        description: Name of the endpoint
  - name: vfu_virtio_create_blk_endpoint
    description: Create vfio-user virtio-blk PCI endpoint.
    params:
      - name: name
        type: string
        required: true
        description: Name of the endpoint
      - name: bdev_name
        type: string
        required: true
        description: Name of the backing block device
      - name: cpumask
        type: string
        description: CPU mask for the endpoint's I/O threads
      - name: num_queues
        type: uint16
        description: 'Number of virtqueues. Default: 64'
      - name: qsize
        type: uint16
        description: 'Number of entries per virtqueue. Default: 128'
      - name: packed_ring
        type: boolean
        description: 'Enable packed virtqueue layout. Default: false'
  - name: vfu_virtio_scsi_add_target
    description: Add block device to specified SCSI target of vfio-user virtio-scsi PCI endpoint.
    params:
      - name: name
        type: string
        required: true
        description: Name of the endpoint
      - name: scsi_target_num
        type: uint8
        required: true
        description: 'SCSI target number: 0-7'
      - name: bdev_name
        type: string
        required: true
        description: Name of the backing block device
  - name: vfu_virtio_scsi_remove_target
    description: Remove a SCSI target of vfio-user virtio-scsi PCI endpoint.
    params:
      - name: name
        type: string
        required: true
        description: Name of the endpoint
      - name: scsi_target_num
        type: uint8
        required: true
        description: 'SCSI target number: 0-7'
  - name: vfu_virtio_create_scsi_endpoint
    description: Create vfio-user virtio-scsi PCI endpoint.
    params:
      - name: name
        type: string
        required: true
        description: Name of the endpoint
      - name: cpumask
        type: string
        description: CPU mask for the endpoint's I/O threads
      - name: num_io_queues
        type: uint16
        description: 'Number of I/O virtqueues (control + event virtqueues added automatically). Default: 62'
      - name: qsize
        type: uint16
        description: 'Number of entries per virtqueue. Default: 128'
      - name: packed_ring
        type: boolean
        description: 'Enable packed virtqueue layout. Default: false'
  - name: vfu_virtio_create_fs_endpoint
    description: Create vfio-user virtio-fs PCI endpoint.
    params:
      - name: name
        type: string
        required: true
        description: Name of the endpoint
      - name: fsdev_name
        type: string
        required: true
        description: Name of the backing fsdev
      - name: tag
        type: string
        required: true
        description: virtiofs mount tag (per virtio specification)
      - name: cpumask
        type: string
        description: CPU mask for the endpoint's I/O threads
      - name: num_queues
        type: uint16
        description: 'Number of virtqueues. Default: 64'
      - name: qsize
        type: uint16
        description: 'Number of entries per virtqueue. Default: 128'
      - name: packed_ring
        type: boolean
        description: 'Enable packed virtqueue layout. Default: false'
  - name: vhost_controller_set_coalescing
    description: |
      Controls interrupt coalescing for specific target. Because `delay_base_us` is used to calculate delay in CPU ticks
      there is no hardcoded limit for this parameter. Only limitation is that final delay in CPU ticks might not overflow
      32 bit unsigned integer (which is more than 1s @ 4GHz CPU). In real scenarios `delay_base_us` should be much lower
      than 150us. To disable coalescing set `delay_base_us` to 0.
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
      - name: delay_base_us
        type: uint32
        required: true
        description: Base coalescing delay in microseconds
      - name: iops_threshold
        type: uint32
        required: true
        description: IOPS threshold above which coalescing kicks in (must be > 0)
  - name: vhost_create_scsi_controller
    description: Construct vhost SCSI target.
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
      - name: cpumask
        type: string
        description: CPU mask for the controller's threads
      - name: delay
        type: boolean
        description: 'Delay controller startup. Default: false'
  - name: vhost_start_scsi_controller
    description: 'Start vhost SCSI controller, if controller is already started, do nothing.'
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
  - name: vhost_scsi_controller_add_target
    description: 'In vhost target `ctrlr` create SCSI target with ID `scsi_target_num` and add `bdev_name` as LUN 0.'
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
      - name: scsi_target_num
        type: int32
        required: true
        description: SCSI target number (0-7), or -1 to pick the first free slot
      - name: bdev_name
        type: string
        required: true
        description: Name of the bdev to expose as LUN 0 of the target
  - name: vhost_scsi_controller_remove_target
    description: |
      Remove SCSI target ID `scsi_target_num` from vhost target `scsi_target_num`.

      This method will fail if initiator is connected, but doesn't support hot-remove (the `VIRTIO_SCSI_F_HOTPLUG` is not negotiated).
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
      - name: scsi_target_num
        type: uint32
        required: true
        description: SCSI target number (0-7)
  - name: virtio_blk_create_transport
    description: Create virtio blk transport.
    params:
      - name: name
        type: string
        required: true
        description: Name of the virtio-blk transport to create
  - name: virtio_blk_get_transports
    description: ""
    params:
      - name: name
        type: string
        description: 'Name of a specific transport to query. Default: list all'
  - name: vhost_create_blk_controller
    description: |
      Create vhost block controller

      If `readonly` is `true` then vhost block target will be created as read only and fail any write requests.
      The `VIRTIO_BLK_F_RO` feature flag will be offered to the initiator.
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
      - name: dev_name
        type: string
        required: true
        description: Name of the bdev to expose as the block device
      - name: readonly
        type: boolean
        description: 'Expose the block device as read-only. Default: false'
      - name: packed_ring
        type: boolean
        description: Set controller as packed ring supported
      - name: cpumask
        type: string
        description: CPU mask for the controller's threads
      - name: transport
        type: string
        description: 'virtio blk transport name (default: vhost_user_blk)'
  - name: vhost_get_controllers
    description: Display information about all or specific vhost controller(s).
    params:
      - name: name
        type: string
        description: 'Name of a specific vhost controller to query. Default: list all'
  - name: vhost_delete_controller
    description: |
      Remove vhost target.

      This call will fail if there is an initiator connected or there is at least one SCSI target configured in case of
      vhost SCSI target. In the later case please remove all SCSI targets first using @ref rpc_vhost_scsi_controller_remove_target.
    params:
      - name: ctrlr
        type: string
        required: true
        description: Name of the vhost controller
  - name: bdev_lvol_create_lvstore
    description: Construct a logical volume store.
    params:
      - name: bdev_name
        type: string
        required: true
        description: Bdev on which to construct the logical volume store
      - name: lvs_name
        type: string
        required: true
        description: Name of the logical volume store to create
      - name: cluster_sz
        type: uint32
        description: Cluster size of the logical volume store in bytes
      - name: clear_method
        type: enum
        class: lvs_clear_method
        description: Clear method for the data region
      - name: num_md_pages_per_cluster_ratio
        type: uint32
        description: Reserved metadata pages per cluster, as a percentage
      - name: md_page_size
        type: uint32
        description: Metadata page size in bytes
  - name: bdev_lvol_delete_lvstore
    description: Destroy a logical volume store.
    params:
      - name: uuid
        type: string
        description: UUID of the logical volume store to destroy
      - name: lvs_name
        type: string
        description: Name of the logical volume store to destroy
  - name: bdev_lvol_get_lvstores
    description: Get a list of logical volume stores.
    params:
      - name: uuid
        type: string
        description: UUID of the logical volume store to retrieve information about
      - name: lvs_name
        type: string
        description: Name of the logical volume store to retrieve information about
  - name: bdev_lvol_rename_lvstore
    description: Rename a logical volume store.
    params:
      - name: old_name
        type: string
        required: true
        description: Existing logical volume store name
      - name: new_name
        type: string
        required: true
        description: New logical volume store name
  - name: bdev_lvol_grow_lvstore
    description: |
      Grow the logical volume store to fill the underlying bdev

      Growth is limited by the number of metadata pages allocated when the lvstore was created,
      and its specific max size can be found using the `max_growable_size` parameter from the
      bdev_lvol_get_lvstores RPC.

      This RPC can be called to grow an lvolstore when the underlying bdev has increased in size.
    params:
      - name: uuid
        type: string
        description: UUID of the logical volume store to grow
      - name: lvs_name
        type: string
        description: Name of the logical volume store to grow
  - name: bdev_lvol_create
    description: Create a logical volume on a logical volume store.
    params:
      - name: lvol_name
        type: string
        required: true
        description: Name of the logical volume to create
      - name: size_in_mib
        type: uint64
        required: true
        description: Desired size of the logical volume in MiB
      - name: thin_provision
        type: boolean
        description: Enable thin provisioning
      - name: uuid
        type: string
        description: UUID of the logical volume store
      - name: lvs_name
        type: string
        description: Name of the logical volume store
      - name: clear_method
        type: enum
        class: lvol_clear_method
        description: Per-cluster clear method
  - name: bdev_lvol_snapshot
    description: Capture a snapshot of the current state of a logical volume.
    params:
      - name: lvol_name
        type: string
        required: true
        description: UUID or alias of the logical volume to create a snapshot from
      - name: snapshot_name
        type: string
        required: true
        description: Name for the newly created snapshot
  - name: bdev_lvol_clone
    description: Create a logical volume based on a snapshot.
    params:
      - name: snapshot_name
        type: string
        required: true
        description: UUID or alias of the snapshot to clone
      - name: clone_name
        type: string
        required: true
        description: Name for the logical volume to create
  - name: bdev_lvol_clone_bdev
    description: |
      Create a logical volume based on an external snapshot bdev. The external snapshot bdev
      is a bdev that will not be written to by any consumer and must not be an lvol in the
      lvstore as the clone.

      Regardless of whether the bdev is specified by name or UUID, the bdev UUID will be stored
      in the logical volume's metadata for use while the lvolstore is loading. For this reason,
      it is important that the bdev chosen has a static UUID.
    params:
      - name: bdev
        type: string
        required: true
        description: Name or UUID for bdev that acts as the external snapshot
      - name: lvs_name
        type: string
        required: true
        description: Name of the logical volume store
      - name: clone_name
        type: string
        required: true
        description: Name for the logical volume to create
  - name: bdev_lvol_rename
    description: Rename a logical volume. New name will rename only the alias of the logical volume.
    params:
      - name: old_name
        type: string
        required: true
        description: UUID or alias of the existing logical volume
      - name: new_name
        type: string
        required: true
        description: New logical volume name
  - name: bdev_lvol_resize
    description: Resize a logical volume.
    params:
      - name: name
        type: string
        required: true
        description: UUID or alias of the logical volume to resize
      - name: size_in_mib
        type: uint64
        required: true
        description: Desired size of the logical volume in MiB
  - name: bdev_lvol_set_read_only
    description: Mark logical volume as read only.
    params:
      - name: name
        type: string
        required: true
        description: UUID or alias of the logical volume to set as read only
  - name: bdev_lvol_delete
    description: Destroy a logical volume.
    params:
      - name: name
        type: string
        required: true
        description: UUID or alias of the logical volume to destroy
  - name: bdev_lvol_inflate
    description: |
      Inflate a logical volume. All unallocated clusters are allocated and copied from the parent or zero filled
      if not allocated in the parent. Then all dependencies on the parent are removed.
    params:
      - name: name
        type: string
        required: true
        description: UUID or alias of the logical volume to inflate
  - name: bdev_lvol_decouple_parent
    description: |
      Decouple the parent of a logical volume. For unallocated clusters which is allocated in the parent, they are
      allocated and copied from the parent, but for unallocated clusters which is thin provisioned in the parent,
      they are kept thin provisioned. Then all dependencies on the parent are removed.
    params:
      - name: name
        type: string
        required: true
        description: UUID or alias of the logical volume to decouple from its parent
  - name: bdev_lvol_get_lvols
    description: |
      Get a list of logical volumes. This list can be limited by lvol store and will display volumes even if
      they are degraded. Degraded lvols do not have an associated bdev, thus this RPC call may return lvols
      not returned by `bdev_get_bdevs`.
    params:
      - name: lvs_uuid
        type: string
        description: Only show volumes in the logical volume store with this UUID
      - name: lvs_name
        type: string
        description: Only show volumes in the logical volume store with this name
  - name: bdev_lvol_set_parent
    description: |
      Set a snapshot as the parent of a lvol, making the lvol a clone of this snapshot.
      The previous parent of the lvol, if any, can be another snapshot or an external snapshot; if the
      lvol is not a clone, it must be thin-provisioned.
      Lvol and parent snapshot must have the same size and must belong to the same lvol store.
    params:
      - name: lvol_name
        type: string
        required: true
        description: UUID or alias of the lvol to set parent of
      - name: parent_name
        type: string
        required: true
        description: UUID or alias of the snapshot to become parent of lvol
  - name: bdev_lvol_set_parent_bdev
    description: |
      Set an external snapshot as the parent of a lvol, making the lvol a clone of this external
      snapshot (see @ref rpc_bdev_lvol_clone_bdev).
      The previous parent of the lvol, if any, can be another external snapshot or a snapshot; if the
      lvol is not a clone, it must be thin-provisioned.
      The size of the external snapshot device must be an integer multiple of cluster size of lvol's lvolstore.
    params:
      - name: lvol_name
        type: string
        required: true
        description: UUID or alias of the lvol to set external parent of
      - name: parent_name
        type: string
        required: true
        description: UUID or name of the external snapshot to become parent of lvol
  - name: bdev_lvol_start_shallow_copy
    description: |
      Start a shallow copy of an lvol over a given bdev. Only clusters allocated to the lvol will be written on the bdev.
      Must have:

      * lvol read only
      * lvol size less or equal than bdev size
      * lvstore block size an even multiple of bdev block size
    params:
      - name: src_lvol_name
        type: string
        required: true
        description: UUID or alias of lvol to create a copy from
      - name: dst_bdev_name
        type: string
        required: true
        description: Name of the bdev that acts as destination for the copy
  - name: bdev_lvol_check_shallow_copy
    description: Get shallow copy status.
    params:
      - name: operation_id
        type: uint32
        required: true
        description: operation identifier
  - name: bdev_raid_set_options
    description: |
      Set options for bdev raid.

      This RPC can be called at any time, but the new value will only take effect for new raid bdevs.

      The `process_window_size_kb` parameter defines the size of the "window" (LBA range of the raid bdev)
      in which a background process like rebuild performs its work. Any positive value is valid, but the value
      actually used by a raid bdev can be adjusted to the size of the raid bdev or the write unit size.
      `process_max_bandwidth_mb_sec` parameter defines the maximum bandwidth used by a background process like
      rebuild. Any positive value or zero is valid, zero means no bandwidth limitation for background process.
      It can only limit the process bandwidth but doesn't guarantee it can be reached. Changing this value will
      not affect existing processes, it will only take effect on new processes generated after the RPC is completed.
    params:
      - name: process_window_size_kb
        type: uint32
        description: Background process (e.g. rebuild) window size in KiB
      - name: process_max_bandwidth_mb_sec
        type: uint32
        description: Background process (e.g. rebuild) maximum bandwidth in MiB/Sec
  - name: bdev_raid_get_bdevs
    description: |
      This is used to list all the raid bdev details based on the input category requested. Category should be one
      of 'all', 'online', 'configuring' or 'offline'. 'all' means all the raid bdevs whether they are online or
      configuring or offline. 'online' is the raid bdev which is registered with bdev layer. 'configuring' is
      the raid bdev which does not have full configuration discovered yet. 'offline' is the raid bdev which is
      not registered with bdev as of now and it has encountered any error or user has requested to offline
      the raid bdev.
    params:
      - name: category
        type: enum
        class: bdev_raid_state
        required: true
        description: all or online or configuring or offline
  - name: bdev_raid_create
    description: Constructs new RAID bdev.
    params:
      - name: name
        type: string
        required: true
        description: RAID bdev name
      - name: strip_size_kb
        type: uint32
        description: Strip size in KB
      - name: raid_level
        type: enum
        class: bdev_raid_level
        required: true
        description: RAID level
      - name: base_bdevs
        type: array
        class: raid_base_bdevs
        required: true
        description: Base bdevs name, whitespace separated list in quotes
      - name: uuid
        type: uuid
        description: UUID for this RAID bdev
      - name: superblock
        type: boolean
        description: 'If set, information about raid bdev will be stored in superblock on each base bdev (default: `false`)'
  - name: bdev_raid_delete
    description: Removes RAID bdev.
    params:
      - name: name
        type: string
        required: true
        description: RAID bdev name
      - name: clear_sb
        type: boolean
        description: If set, clear the superblock from all base bdevs
  - name: bdev_raid_add_base_bdev
    description: |
      Add base bdev to existing raid bdev. The raid bdev must have an empty base bdev slot.
      The bdev must be large enough and have the same block size and metadata format as the other base bdevs.
    params:
      - name: raid_bdev
        type: string
        required: true
        description: Raid bdev name
      - name: base_bdev
        type: string
        required: true
        description: Base bdev name
  - name: bdev_raid_remove_base_bdev
    description: Remove base bdev from existing raid bdev.
    params:
      - name: name
        type: string
        required: true
        description: Base bdev name in RAID
  - name: bdev_split_create
    description: This is used to split an underlying block device and create several smaller equal-sized vbdevs.
    params:
      - name: base_bdev
        type: string
        required: true
        description: base bdev name
      - name: split_count
        type: uint32
        required: true
        description: number of splits
      - name: split_size_mb
        type: uint64
        description: size in MB to restrict the size
  - name: bdev_split_delete
    description: This is used to remove the split vbdevs.
    params:
      - name: base_bdev
        type: string
        required: true
        description: base bdev name
  - name: bdev_uring_create
    description: Create a bdev with io_uring backend.
    params:
      - name: filename
        type: string
        required: true
        description: 'path to device or file (ex: /dev/nvme0n1)'
      - name: name
        type: string
        required: true
        description: name of bdev
      - name: block_size
        type: uint32
        description: block size of device (If omitted, get the block size from the file)
      - name: uuid
        type: uuid
        description: UUID of new bdev
  - name: bdev_uring_rescan
    description: Rescan the size of a uring bdev.
    params:
      - name: name
        type: string
        required: true
        description: name of uring bdev to rescan
  - name: bdev_uring_delete
    description: Remove a uring bdev.
    params:
      - name: name
        type: string
        required: true
        description: name of uring bdev to delete
  - name: bdev_nvme_opal_init
    description: 'This is used to initialize OPAL of a given NVMe ctrlr, including taking ownership and activating.'
    params:
      - name: nvme_ctrlr_name
        type: string
        required: true
        description: name of nvme ctrlr
      - name: password
        type: string
        required: true
        description: admin password of OPAL
  - name: bdev_nvme_opal_revert
    description: This is used to revert OPAL to its factory settings. Erase all user configuration and data.
    params:
      - name: nvme_ctrlr_name
        type: string
        required: true
        description: name of nvme ctrlr
      - name: password
        type: string
        required: true
        description: admin password of OPAL
  - name: bdev_opal_create
    description: This is used to create an OPAL virtual bdev.
    params:
      - name: nvme_ctrlr_name
        type: string
        required: true
        description: name of nvme ctrlr that supports OPAL
      - name: nsid
        type: uint32
        required: true
        description: namespace ID
      - name: locking_range_id
        type: uint16
        required: true
        description: OPAL locking range ID
      - name: range_start
        type: uint64
        required: true
        description: locking range start LBA
      - name: range_length
        type: uint64
        required: true
        description: locking range length
      - name: password
        type: string
        required: true
        description: admin password of OPAL
  - name: bdev_opal_get_info
    description: This is used to get information of a given OPAL bdev.
    params:
      - name: bdev_name
        type: string
        required: true
        description: name of OPAL vbdev
      - name: password
        type: string
        required: true
        description: admin password
  - name: bdev_opal_delete
    description: This is used to delete OPAL vbdev.
    params:
      - name: bdev_name
        type: string
        required: true
        description: name of OPAL vbdev
      - name: password
        type: string
        required: true
        description: admin password
  - name: bdev_opal_new_user
    description: |
      This enables a new user to the specified opal bdev so that the user can lock/unlock the bdev.
      Recalling this for the same opal bdev, only the newest user will have the privilege.
    params:
      - name: bdev_name
        type: string
        required: true
        description: name of OPAL vbdev
      - name: admin_password
        type: string
        required: true
        description: admin password
      - name: user_id
        type: uint16
        required: true
        description: user ID
      - name: user_password
        type: string
        required: true
        description: user password
  - name: bdev_opal_set_lock_state
    description: This is used to lock/unlock specific opal bdev providing user ID and password.
    params:
      - name: bdev_name
        type: string
        required: true
        description: name of OPAL vbdev
      - name: user_id
        type: uint16
        required: true
        description: user ID
      - name: password
        type: string
        required: true
        description: user password
      - name: lock_state
        type: string
        required: true
        description: lock state
  - name: notify_get_types
    description: Return list of all supported notification types.
    params: []
  - name: notify_get_notifications
    description: |
      Request notifications. Returns array of notifications that happened since the specified id (or first that is available).

      Notice: Notifications are kept in circular buffer with limited size. Older notifications might be inaccessible
      due to being overwritten by new ones.
    params:
      - name: id
        type: uint64
        description: 'Index of the first event to return. Default: 0 (oldest available)'
      - name: max
        type: uint64
        description: 'Maximum number of events to return. Default: no limit'
  - name: keyring_file_add_key
    description: Add a file-based key to a keyring.
    params:
      - name: name
        type: string
        required: true
        description: Name of the key
      - name: path
        type: string
        required: true
        description: Path to the file containing the key
  - name: keyring_file_remove_key
    description: Remove a file-based key from a keyring.
    params:
      - name: name
        type: string
        required: true
        description: Name of the key
  - name: keyring_get_keys
    description: |
      Get a list of available keys.  This RPC will only list keys that are currently attached to a
      keyring.  Dynamically loaded keys (via the `probe_key()` callback) will only be included if they're
      currently in-use (i.e. with active references obtained via `spdk_keyring_get_key()`).
    params: []
  - name: keyring_linux_set_options
    description: Set options of the keyring_linux module.
    params:
      - name: enable
        type: boolean
        description: 'Enable the Linux keyring module. Default: false'
  - name: ublk_create_target
    description: |
      Start to create ublk threads and initialize ublk target. It will return an error if user calls this RPC twice without
      ublk_destroy_target in between. It will use current cpumask in SPDK when user does not specify cpumask option.
    params:
      - name: cpumask
        type: string
        description: CPU mask for the ublk target's I/O threads
      - name: disable_user_copy
        type: boolean
        description: 'Disable the ublk user-copy feature. Default: false'
  - name: ublk_destroy_target
    description: Release all UBLK devices and destroy ublk target.
    params: []
  - name: ublk_start_disk
    description: Start to export one SPDK bdev as a UBLK device
    params:
      - name: bdev_name
        type: string
        required: true
        description: Name of the bdev to export
      - name: ublk_id
        type: uint32
        required: true
        description: ublk device ID, used as the suffix in /dev/ublkb[id]
      - name: queue_depth
        type: uint32
        description: 'Per-queue depth. Default: 128'
      - name: num_queues
        type: uint32
        description: 'Number of queues to create on the device. Default: 1'
  - name: ublk_recover_disk
    description: Recover original UBLK device with ID and block device
    params:
      - name: bdev_name
        type: string
        required: true
        description: Name of the bdev backing the recovering ublk device
      - name: ublk_id
        type: uint32
        required: true
        description: ID of the ublk device to recover
  - name: ublk_stop_disk
    description: Delete a UBLK device
    params:
      - name: ublk_id
        type: uint32
        required: true
        description: ID of the ublk device to stop
  - name: ublk_get_disks
    description: Display full or specified ublk device list
    params:
      - name: ublk_id
        type: uint32
        description: 'ID of a ublk device to query. Default: list all'
  - name: nbd_start_disk
    description: Start to export one SPDK bdev as NBD disk
    params:
      - name: bdev_name
        type: string
        required: true
        description: Name of the bdev to export
      - name: nbd_device
        type: string
        description: 'Path to the NBD device, e.g. "/dev/nbd0". Default: first available device'
  - name: nbd_stop_disk
    description: Stop one NBD disk which is based on SPDK bdev.
    params:
      - name: nbd_device
        type: string
        required: true
        description: Path to the NBD device, e.g. "/dev/nbd0"
  - name: nbd_get_disks
    description: Display all or specified NBD device list
    params:
      - name: nbd_device
        type: string
        description: 'Path to the NBD device, e.g. "/dev/nbd0". Default: list all'
  - name: sock_impl_get_options
    description: Get parameters for the socket layer implementation.
    params:
      - name: impl_name
        type: string
        required: true
        description: Socket implementation name (e.g. "posix", "ssl", "uring")
  - name: sock_impl_set_options
    description: Set parameters for the socket layer implementation.
    params:
      - name: impl_name
        type: string
        required: true
        description: Socket implementation name (e.g. "posix", "ssl", "uring")
      - name: recv_buf_size
        type: uint32
        description: Receive buffer size in bytes
      - name: send_buf_size
        type: uint32
        description: Send buffer size in bytes
      - name: enable_recv_pipe
        type: boolean
        description: Enable or disable receive pipe
      - name: enable_quickack
        type: boolean
        description: Enable or disable quick ACK
      - name: enable_placement_id
        type: uint32
        description: 'Placement ID source: 0=disable, 1=incoming_napi, 2=incoming_cpu'
      - name: enable_zerocopy_send_server
        type: boolean
        description: Enable zero-copy on send for server sockets
      - name: enable_zerocopy_send_client
        type: boolean
        description: Enable zero-copy on send for client sockets
      - name: zerocopy_threshold
        type: uint32
        description: Send size threshold in bytes below which the zerocopy flag is omitted
      - name: tls_version
        type: uint32
        description: TLS protocol version (e.g. 13 for TLS 1.3) (ssl only)
      - name: enable_ktls
        type: boolean
        description: 'Enable Kernel TLS (ssl only). Default: false'
  - name: sock_set_default_impl
    description: Set the default sock implementation.
    params:
      - name: impl_name
        type: string
        required: true
        description: Socket implementation name (e.g. "posix", "ssl", "uring")
  - name: sock_get_default_impl
    description: Get the name of the default sock implementation.
    params: []
  - name: bdev_nvme_send_cmd
    description: |
      Send NVMe command directly to NVMe controller or namespace. Parameters and responses encoded by base64 urlsafe need further processing.

      Notice: bdev_nvme_send_cmd requires user to guarantee the correctness of NVMe command itself, and also optional parameters.
      Illegal command contents or mismatching buffer size may result in unpredictable behavior.
    params:
      - name: name
        type: string
        required: true
        description: Name of the operating NVMe controller
      - name: cmd_type
        type: enum
        class: bdev_nvme_cmd_type
        required: true
        description: Type of NVMe command
      - name: data_direction
        type: enum
        class: bdev_nvme_data_direction
        required: true
        description: Direction of data transfer
      - name: cmdbuf
        type: string
        required: true
        description: NVMe command encoded by base64 urlsafe
      - name: data
        type: string
        description: Data transferring to controller from host, encoded by base64 urlsafe
      - name: metadata
        type: string
        description: Metadata transferring to controller from host, encoded by base64 urlsafe
      - name: data_len
        type: uint32
        description: Data length required to transfer from controller to host
      - name: metadata_len
        type: uint32
        description: Metadata length required to transfer from controller to host
      - name: timeout_ms
        type: uint32
        description: Command execution timeout value, in milliseconds
  - name: vmd_enable
    description: Enable VMD enumeration.
    params: []
  - name: vmd_remove_device
    description: Remove a device behind a VMD.
    params:
      - name: addr
        type: string
        required: true
        description: PCI address of the device to remove
  - name: vmd_rescan
    description: Force a rescan of the devices behind VMD.
    params: []
  - name: spdk_get_version
    description: Get the version info of the running SPDK application.
    params: []
  - name: framework_get_pci_devices
    description: List PCIe devices attached to an SPDK application and the contents of their config space.
    params: []
  - name: bdev_nvme_add_error_injection
    description: Add a NVMe command error injection for a bdev nvme controller.
    params:
      - name: name
        type: string
        required: true
        description: Name of the operating NVMe controller
      - name: cmd_type
        type: enum
        class: bdev_nvme_cmd_type
        required: true
        description: Type of NVMe command
      - name: opc
        type: uint8
        required: true
        description: Opcode for which the error injection is applied
      - name: do_not_submit
        type: boolean
        description: Set to true if request should not be submitted to the controller (default false)
      - name: timeout_in_us
        type: uint64
        description: Wait specified microseconds when do_not_submit is true
      - name: err_count
        type: uint32
        description: Number of matching NVMe commands to inject errors
      - name: sct
        type: uint8
        description: Status code type (default 0)
      - name: sc
        type: uint8
        description: Status code (default 0)
  - name: bdev_nvme_remove_error_injection
    description: Remove a NVMe command error injection.
    params:
      - name: name
        type: string
        required: true
        description: Name of the operating NVMe controller
      - name: cmd_type
